# Supported Node/npm lifecycle-refusal rollback. Real release rollback also runs in CI.
name: npm rollback proof

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    paths:
      - scripts/ci/npm-rollback-proof.sh
      - .github/workflows/npm-rollback-proof.yml
      - package.json
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'

# Superseded PR work releases runners; branch/release/weekly runs are retained.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rollback:
    strategy:
      fail-fast: false
      matrix:
        # No skipped Mac check-runs on a PR/main head; deferred events add them.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && '["ubuntu-24.04", "ubuntu-26.04", "macos-latest"]' || '["ubuntu-24.04"]') }}
        npm: ["10.9.9", "11.6.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: npm ${{ matrix.npm }} beside supported Node 22
        run: npm install --prefix "$RUNNER_TEMP/npm-${{ matrix.npm }}" "npm@${{ matrix.npm }}"
      - name: A refused global install leaves the previous version
        run: bash scripts/ci/npm-rollback-proof.sh "$(command -v node)" "$RUNNER_TEMP/npm-${{ matrix.npm }}/node_modules/npm/bin/npm-cli.js"

  verdict:
    name: npm rollback proof
    runs-on: ubuntu-24.04
    needs: [rollback]
    if: always()
    steps:
      - name: Require the complete proof
        env:
          RESULT: ${{ needs.rollback.result }}
        run: test "$RESULT" = success
