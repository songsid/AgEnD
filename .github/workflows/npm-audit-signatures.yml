# #2528 PR 2: verify npm registry signatures of the installed trees.
# Invalid signatures, invalid attestations, mixed findings, and command or
# parse failures fail the job. Missing-only findings are printed and do not
# fail (our policy: npm 10 exits 1 for missing as well as invalid).
# Install uses --ignore-scripts: this job only needs the lockfile tree, not
# native builds or binary postinstalls.
name: npm audit signatures

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**', 'feat/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the PR diff
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh
      - name: Skip when package.json and the lockfile did not change
        if: steps.changes.outputs.deps != 'true'
        run: echo "Not a deps change — signatures skipped."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.deps == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install the root tree without lifecycle scripts
        if: steps.changes.outputs.deps == 'true'
        run: npm ci --ignore-scripts
      - name: Verify registry signatures (root)
        if: steps.changes.outputs.deps == 'true'
        run: bash scripts/ci/audit-signatures.sh .
      - name: Install the website tree without lifecycle scripts
        if: steps.changes.outputs.deps == 'true'
        working-directory: website
        run: npm ci --ignore-scripts
      - name: Verify registry signatures (website)
        if: steps.changes.outputs.deps == 'true'
        run: bash scripts/ci/audit-signatures.sh website
