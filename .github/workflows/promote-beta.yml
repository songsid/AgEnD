name: Promote beta

# #2987 (M-2295): a vX.Y.Z-beta.N tag publishes to the npm dist-tag `rc` (publish.yml), so no beta user installs a
# candidate. Once it has run on the test host (`agend update --rc`), the leader runs this to move `beta` to it:
#   Actions → Promote beta → Run workflow → version 2.3.5-beta.1, dry_run off.
# Nothing is published or rebuilt: the exact tarball the candidate was tested as becomes @beta.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The candidate to promote, X.Y.Z-beta.N (already published to @rc)"
        required: true
        type: string
      dry_run:
        description: "Check and print what would happen, without moving the dist-tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# The same group as publish.yml: a promotion never interleaves with a release run.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PACKAGE: "@songsid/agend"
      # Inputs reach the script through env, never interpolated into it.
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The candidate exists on the registry, exactly as asked, and beta would not move backwards.
      - name: Check the candidate
        run: |
          set -euo pipefail
          PUBLISHED="$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED" != "$VERSION" ]; then echo "::error::$PACKAGE@$VERSION is not on the registry"; exit 1; fi
          CURRENT_BETA="$(npm view "$PACKAGE@beta" version 2>/dev/null || true)"
          CURRENT_RC="$(npm view "$PACKAGE@rc" version 2>/dev/null || true)"
          ACTION="$(node scripts/release/promote-beta.mjs "$VERSION" "$CURRENT_BETA")"
          echo "beta: ${CURRENT_BETA:-(none)}  rc: ${CURRENT_RC:-(none)}  candidate: $VERSION  → $ACTION"
          if [ -n "$CURRENT_RC" ] && [ "$CURRENT_RC" != "$VERSION" ]; then
            echo "::warning::@rc is $CURRENT_RC, not $VERSION: promoting a candidate other than the newest"
          fi
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"

      - name: Dry run (no dist-tag moved)
        if: env.DRY_RUN == 'true'
        run: |
          echo "dry run — would run: npm dist-tag add $PACKAGE@$VERSION beta  (action: $ACTION)"

      # npm trusted publishing (OIDC) covers `npm publish` only; moving a dist-tag needs a token with write access
      # to the package, in the repository secret NPM_TOKEN.
      - name: Move beta to the candidate
        if: env.DRY_RUN != 'true' && env.ACTION == 'promote'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then echo "::error::the NPM_TOKEN secret is not set; a dist-tag cannot be moved through OIDC"; exit 1; fi
          npm dist-tag add "$PACKAGE@$VERSION" beta

      # The registry can take a moment to answer with the new tag: look again for up to a minute.
      - name: Verify beta
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            NOW="$(npm view "$PACKAGE@beta" version 2>/dev/null || true)"
            if [ "$NOW" = "$VERSION" ]; then echo "@beta is $VERSION"; exit 0; fi
            sleep 6
          done
          echo "::error::@beta is ${NOW:-(unreadable)}, not $VERSION"
          exit 1
