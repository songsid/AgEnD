name: CI

on:
  # release/** are maintenance lines (release/2.1: 2.1.x fixes cherry-picked from main). Their PRs and pushes
  # get the same checks as main's.
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# Cancel in-progress runs for the same PR when a new commit arrives. Push runs on
# main/release/** are deliberately NOT cancelled — they are needed for release tagging.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── docs-only guard ──────────────────────────────────────────────────────────
  # Detect whether this run touches only docs/changes/markdown. The result is
  # consumed by every downstream job so none of them repeat the diff. Running
  # as its own job avoids a checkout + diff in each parallel shard.
  #
  # We use a job output rather than paths-ignore so the `build` check always
  # exists and can satisfy the gate even for a pure docs commit. paths-ignore
  # would make the check missing and the gate would block.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect whether this is a docs-only change
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A push to main/release always runs the full suite — the gate needs CI.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # .github/** changes must always run the full suite.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^\.github/'; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any file outside docs/, changes/, or a root *.md triggers full CI.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qvE '^(docs|changes)/|^[^/]+\.md$'; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  # ── changelog guards (no install needed) ────────────────────────────────────
  changelog:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CHANGELOG fragments (docs/development.md): every changes/*.md parses
      # and has its zh-TW pair, and a PR adds fragments instead of editing
      # docs/CHANGELOG*.md. Only the assemble commit (trailer
      # "Changelog: assemble") edits those. Neither script needs npm ci.
      - name: CHANGELOG fragments are valid
        run: node scripts/changelog-assemble.mjs --check
      - name: CHANGELOG is assembled, not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changelog-guard.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  # ── setup: install, typecheck, build — shared across all shards ─────────────
  setup:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The test suites are excluded from tsconfig.json (it emits dist/ from
      # src/ only), so nothing above sees them. Without this line the check
      # exists in package.json and runs nowhere, which is how it drifted to
      # 308 errors before anyone looked.
      - run: npm run typecheck:tests
      - run: npm run build
      # Share node_modules and dist with the parallel shards so they don't
      # repeat `npm ci` or `npm run build`.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            node_modules/
          retention-days: 1

  # ── test shards ──────────────────────────────────────────────────────────────
  test-shard:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          # Download directly into the workspace root so node_modules/ and
          # dist/ land at $GITHUB_WORKSPACE/ rather than a subdirectory.
          path: .
      - name: Run test shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # ── integration tests (serial, real-resource) ────────────────────────────────
  test-integration:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          # Download directly into the workspace root so node_modules/ and
          # dist/ land at $GITHUB_WORKSPACE/ rather than a subdirectory.
          path: .
      # Real tmux/child-process suites run in one worker. The unit suite above
      # remains file-parallel, while this bounded serial invocation prevents
      # host scheduler contention from turning diagnostic timing into flakes.
      - run: npm run test:integration

  # ── aggregate ────────────────────────────────────────────────────────────────
  # The gate requires a check named exactly "build". This job aggregates every
  # shard and the changelog + integration jobs; it fails when any upstream job
  # fails. For docs-only PRs it passes immediately without running any of the
  # heavy steps above.
  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, changelog, setup, test-shard, test-integration]
    if: always()
    steps:
      - name: Check all jobs succeeded
        env:
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs-only }}
          CHANGELOG: ${{ needs.changelog.result }}
          SETUP: ${{ needs.setup.result }}
          SHARD: ${{ needs.test-shard.result }}
          INTEGRATION: ${{ needs.test-integration.result }}
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only change — skipped install/test. build passes."
            exit 0
          fi
          failed=()
          for name_result in "changelog:$CHANGELOG" "setup:$SETUP" "test-shard:$SHARD" "test-integration:$INTEGRATION"; do
            name="${name_result%%:*}"
            result="${name_result##*:}"
            if [ "$result" != "success" ]; then
              failed+=("$name ($result)")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed jobs: ${failed[*]}" >&2
            exit 1
          fi
          echo "All jobs succeeded."

      # Tell Discord how this run ended, whichever way it ended.
      #
      # `always()` so a failure is reported at all, and `continue-on-error` so a
      # webhook that is down or rate-limited cannot turn a green run red — the
      # notification is about the result, it is not part of it.
      #
      # The webhook is a secret, and a secret cannot be read from a step's `if:`,
      # so the step always starts and the script skips when it is unset: a fork
      # with no secret gets a line in the log rather than a failure.
      #
      # Everything else goes through `env` too, never interpolated into the
      # script. A commit message is attacker-controlled text and `${{ … }}`
      # written inline becomes part of the command that runs.
      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORDWEBHOOK }}
          # Post only when something went wrong. A green run is the normal
          # case, and a channel that announces every one of them buries the
          # red ones it exists for.
          NOTIFY_ON: failure
          STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          # On a pull_request run `github.sha` is the synthetic merge
          # commit, a SHA nobody can find in the repository. Same trap as
          # `ref_name` saying `123/merge` instead of the branch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORDWEBHOOK is not set - skipping the Discord notification."
            exit 0
          fi
          # A misconfigured secret should say so. Without this, a URL that
          # lost a character somewhere between Discord and the secret box fails
          # as `Protocol "ttps" not supported`, which reads like a curl problem
          # rather than a secret problem. The value itself is never echoed.
          case "$DISCORD_WEBHOOK" in
            https://*) ;;
            *)
              echo "DISCORDWEBHOOK is set but does not start with https:// - check the secret value." >&2
              exit 1 ;;
          esac
          # NOTIFY_ON=failure: post only when the run failed. A success is
          # the normal case and a cancelled run was superseded on purpose;
          # neither is something to act on. The check lives here and not in
          # a step-level `if: failure()` for the same reason the webhook
          # check does: the step must start on every run so a broken secret
          # is still reported, and the shape check above runs first so it
          # is. One script for all four workflows; which runs post is the
          # workflow's env, not a fork.
          if [ "${NOTIFY_ON:-always}" = "failure" ] && [ "$STATUS" != "failure" ]; then
            echo "Run ended ${STATUS} - posting failures only (NOTIFY_ON=failure), skipping."
            exit 0
          fi
          # Built by a JSON library rather than by string interpolation, so a
          # commit message carrying quotes, braces or backslashes cannot produce
          # a payload Discord rejects - and the first time that happened would
          # be the run somebody needed to hear about.
          python3 - <<'PY' > payload.json
          import json, os
          status = os.environ["STATUS"]
          look = {
              "success":   (3066993,  "✅"),   # green
              "failure":   (15158332, "❌"),   # red
              "cancelled": (9807270,  "⚪"),   # grey
          }
          colour, icon = look.get(status, (15844367, "⚠️"))  # amber for a status we do not know
          branch = os.environ.get("HEAD_REF") or os.environ.get("REF_NAME") or "(unknown)"
          # First line only: a commit body would swallow the embed.
          lines = os.environ.get("COMMIT_MESSAGE", "").splitlines()
          subject = lines[0] if lines else "(no commit message)"
          sha = os.environ.get("SHA", "")[:7]
          print(json.dumps({"embeds": [{
              "title": f"{icon} {os.environ['WORKFLOW']} - {status}",
              "url": os.environ["RUN_URL"],
              "color": colour,
              "fields": [
                  {"name": "Repository", "value": os.environ["REPO"], "inline": True},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Event", "value": f"{os.environ['EVENT']} by {os.environ['ACTOR']}", "inline": True},
                  {"name": "Commit", "value": f"`{sha}` {subject}"[:1024]},
              ],
          }]}))
          PY
          curl --silent --show-error --fail-with-body \
            --max-time 20 --retry 2 --retry-connrefused \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
