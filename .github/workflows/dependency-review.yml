# #2528 PR 3: fail a PR that introduces high/critical advisories or a
# licence outside the allow-list. GitHub's dependency-review API diffs
# the PR against its base; this is not a full-tree audit of main.
name: Dependency review

on:
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the PR diff
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh
      - name: Skip when package.json and the lockfile did not change
        if: steps.changes.outputs.deps != 'true'
        run: echo "Not a deps change — dependency-review skipped."
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.changes.outputs.deps == 'true'
        with:
          config-file: ./.github/dependency-review-config.yml
