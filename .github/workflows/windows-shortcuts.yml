# M-2885: the desktop shortcuts on a real Windows — Windows PowerShell 5.1, the real WScript.Shell, the AgEnD icons on both
# shortcuts (scripts/ci/windows-shortcuts-check.mts). Only for changes to the shortcut code or its icons, and on demand;
# not part of the required CI gate. The rendered icons are uploaded for review.
name: Windows shortcuts

on:
  pull_request:
    paths:
      - templates/windows-shortcuts.ps1
      - templates/icons/**
      - website/public/install-agend.ps1
      - src/windows-shortcuts.ts
      - scripts/ci/windows-shortcuts-check.mts
      - .github/workflows/windows-shortcuts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-shortcuts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shortcuts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # The files as the npm package ships them (LF): Windows runners check out with CRLF by default, and the shared
      # template's header ends at its first blank line ("\n\n").
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: main's shortcut code, for the check's control run
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Install (no native builds needed for this check)
        run: npm ci --ignore-scripts
      - name: Make the shortcuts with the icons, read them back
        env:
          OUT: ${{ runner.temp }}/shortcut-check
        run: npx tsx scripts/ci/windows-shortcuts-check.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-shortcut-icons
          path: ${{ runner.temp }}/shortcut-check
          retention-days: 7
