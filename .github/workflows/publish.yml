name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use OIDC-capable npm
        run: npm install --global npm@11

      - run: npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - name: Determine npm tag
        run: |
          if [[ "$VERSION" == *-beta* ]]; then
            echo "NPM_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Set package version
        run: npm pkg set "version=$VERSION"
      - name: Publish
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORDWEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No webhook configured, skipping Discord notification"
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993  # green
            EMOJI="🚀"
            TITLE="Published v$VERSION ($NPM_TAG)"
          else
            COLOR=15158332  # red
            EMOJI="❌"
            TITLE="Publish Failed"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > payload.json << EOF
          {
            "embeds": [{
              "title": "$EMOJI $TITLE",
              "url": "$RUN_URL",
              "color": $COLOR,
              "fields": [
                {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
                {"name": "Tag", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "NPM Tag", "value": "$NPM_TAG", "inline": true},
                {"name": "Commit", "value": "[\`$SHORT_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": true}
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF

          curl -sf -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" || echo "Discord notification failed (non-fatal)"
