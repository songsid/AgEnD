name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# One release at a time (#1271 review): "read latest → compare → publish" must not interleave with another
# release run, or an older stable that passed its check before a newer one published could still move latest
# back. A running release is never cancelled. GitHub keeps only one *pending* run per group, so when two more tags
# queue behind a running one the older pending run is cancelled; a cancelled run publishes nothing (re-run it, or
# push its tag again, once the queue is clear).
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Before anything is built: a tag that cannot be published fails here.
      - name: Set version from tag
        run: |
          # Only a v-tag, and only version characters, may reach GITHUB_ENV (a newline would add a line of its own).
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::not a v* tag: $GITHUB_REF"; exit 1 ;; esac
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then echo "::error::unexpected characters in the tag"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # X.Y.Z → latest, X.Y.Z-beta.N → beta, X.Y.Z-alpha.N → alpha; anything else fails the job, and latest never
      # moves backwards (#1259). A failed lookup of the current latest skips only that last check.
      - name: Determine npm tag
        run: |
          LATEST="$(npm view @songsid/agend@latest version 2>/dev/null || true)"
          NPM_TAG="$(node scripts/npm-dist-tag.mjs "$VERSION" "$LATEST")"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"

      - name: Use OIDC-capable npm
        run: npm install --global npm@11

      - run: npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Set package version
        run: npm pkg set "version=$VERSION"
      # #1488: 2.2 ships its own Node only through optionalDependencies pins; without them every host would run AgEnD on
      # whatever Node it has. What npm will publish — the packed manifest — must pin each shipped runtime package
      # exactly, to one version, and each must already be on the registry (scripts/release/check-runtime-pins.mjs).
      - name: The packed package pins its bundled Node, as published runtime packages
        run: |
          TARBALL="$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          node scripts/release/check-runtime-pins.mjs "$RUNNER_TEMP/$TARBALL"
      # The latest check again, right before publishing: the build took minutes, and the check is only as good
      # as the latest it read. The concurrency group keeps other release runs out of this window.
      - name: Publish
        run: |
          LATEST="$(npm view @songsid/agend@latest version 2>/dev/null || true)"
          test "$(node scripts/npm-dist-tag.mjs "$VERSION" "$LATEST")" = "$NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"

      # Tell Discord how this run ended, whichever way it ended.
      #
      # `always()` so a failure is reported at all, and `continue-on-error` so a
      # webhook that is down or rate-limited cannot turn a green run red — the
      # notification is about the result, it is not part of it.
      #
      # The webhook is a secret, and a secret cannot be read from a step's `if:`,
      # so the step always starts and the script skips when it is unset: a fork
      # with no secret gets a line in the log rather than a failure.
      #
      # Everything else goes through `env` too, never interpolated into the
      # script. A commit message is attacker-controlled text and `${{ … }}`
      # written inline becomes part of the command that runs.
      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORDWEBHOOK }}
          STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          # On a pull_request run `github.sha` is the synthetic merge
          # commit, a SHA nobody can find in the repository. Same trap as
          # `ref_name` saying `123/merge` instead of the branch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORDWEBHOOK is not set - skipping the Discord notification."
            exit 0
          fi
          # A misconfigured secret should say so. Without this, a URL that
          # lost a character somewhere between Discord and the secret box fails
          # as `Protocol "ttps" not supported`, which reads like a curl problem
          # rather than a secret problem. The value itself is never echoed.
          case "$DISCORD_WEBHOOK" in
            https://*) ;;
            *)
              echo "DISCORDWEBHOOK is set but does not start with https:// - check the secret value." >&2
              exit 1 ;;
          esac
          # NOTIFY_ON=failure: post only when the run failed. A success is
          # the normal case and a cancelled run was superseded on purpose;
          # neither is something to act on. The check lives here and not in
          # a step-level `if: failure()` for the same reason the webhook
          # check does: the step must start on every run so a broken secret
          # is still reported, and the shape check above runs first so it
          # is. One script for all four workflows; which runs post is the
          # workflow's env, not a fork.
          if [ "${NOTIFY_ON:-always}" = "failure" ] && [ "$STATUS" != "failure" ]; then
            echo "Run ended ${STATUS} - posting failures only (NOTIFY_ON=failure), skipping."
            exit 0
          fi
          # Built by a JSON library rather than by string interpolation, so a
          # commit message carrying quotes, braces or backslashes cannot produce
          # a payload Discord rejects - and the first time that happened would
          # be the run somebody needed to hear about.
          python3 - <<'PY' > payload.json
          import json, os
          status = os.environ["STATUS"]
          look = {
              "success":   (3066993,  "✅"),   # green
              "failure":   (15158332, "❌"),   # red
              "cancelled": (9807270,  "⚪"),   # grey
          }
          colour, icon = look.get(status, (15844367, "⚠️"))  # amber for a status we do not know
          branch = os.environ.get("HEAD_REF") or os.environ.get("REF_NAME") or "(unknown)"
          # First line only: a commit body would swallow the embed.
          lines = os.environ.get("COMMIT_MESSAGE", "").splitlines()
          subject = lines[0] if lines else "(no commit message)"
          sha = os.environ.get("SHA", "")[:7]
          print(json.dumps({"embeds": [{
              "title": f"{icon} {os.environ['WORKFLOW']} - {status}",
              "url": os.environ["RUN_URL"],
              "color": colour,
              "fields": [
                  {"name": "Repository", "value": os.environ["REPO"], "inline": True},
                  {"name": "Branch", "value": branch, "inline": True},
                  {"name": "Event", "value": f"{os.environ['EVENT']} by {os.environ['ACTOR']}", "inline": True},
                  {"name": "Commit", "value": f"`{sha}` {subject}"[:1024]},
              ],
          }]}))
          PY
          curl --silent --show-error --fail-with-body \
            --max-time 20 --retry 2 --retry-connrefused \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
