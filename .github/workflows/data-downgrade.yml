name: Data downgrade compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the published baseline in an isolated prefix
        id: baseline
        env:
          BASELINE_PREFIX: ${{ runner.temp }}/agend-downgrade-baseline
        run: |
          set -euo pipefail
          echo "node=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
          npm install --global --prefix "$BASELINE_PREFIX" --no-audit --no-fund @songsid/agend@2.1.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build current stores
        run: npm ci && npm run build
      - name: Current Node 22 → published 2.1.12 Node 20 → current Node 22
        env:
          OLD_NODE: ${{ steps.baseline.outputs.node }}
          OLD_PACKAGE: ${{ runner.temp }}/agend-downgrade-baseline/lib/node_modules/@songsid/agend
        run: node scripts/check-data-downgrade.mjs "$OLD_PACKAGE" "$OLD_NODE" | tee data-downgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-downgrade-result
          path: data-downgrade.json
