name: Data downgrade compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'

# Cancel an obsolete PR probe without cancelling branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  data-downgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the PR diff
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh
      - name: Skip when src/ did not change
        if: steps.changes.outputs.src != 'true'
        run: echo "Not a src change — data-downgrade skipped."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.src == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Published previous release (cached, integrity-checked)
        id: baseline-tarball
        if: steps.changes.outputs.src == 'true'
        uses: ./.github/actions/published-agend-tarball
        with:
          version: '2.3.3'
      - name: Install previous release in an isolated prefix
        id: baseline
        if: steps.changes.outputs.src == 'true'
        env:
          BASELINE_PREFIX: ${{ runner.temp }}/agend-downgrade-baseline
          BASELINE_TGZ: ${{ steps.baseline-tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          bash scripts/ci/install-published-tarball.sh @songsid/agend "$BASELINE_TGZ" --prefix "$BASELINE_PREFIX"
          PKG="$BASELINE_PREFIX/lib/node_modules/@songsid/agend"
          GOT="$(node -p 'require(process.argv[1]).version' "$PKG/package.json")"
          [ "$GOT" = 2.3.3 ] || { echo "::error::baseline installed $GOT, expected 2.3.3"; exit 1; }
          NODE="$PKG/node_modules/@songsid/agend-node-linux-x64/bin/node"
          [ -x "$NODE" ] || { echo "::error::baseline private Node missing"; exit 1; }
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
      - name: Build current stores
        if: steps.changes.outputs.src == 'true'
        run: npm ci && npm run build
      - name: Office and setup directory validate on the previous release
        if: steps.changes.outputs.src == 'true'
        env:
          OLD_PACKAGE: ${{ runner.temp }}/agend-downgrade-baseline/lib/node_modules/@songsid/agend
        run: |
          node scripts/check-office-config-downgrade.mjs "$OLD_PACKAGE"
          node scripts/check-setup-workdir-downgrade.mjs "$OLD_PACKAGE"
      - name: A failed probe fails the workflow step
        if: steps.changes.outputs.src == 'true'
        run: node scripts/check-data-downgrade-workflow.mjs
      - name: Current → previous release 2.3.3 → current
        id: roundtrip
        if: steps.changes.outputs.src == 'true'
        shell: bash
        env:
          OLD_NODE: ${{ steps.baseline.outputs.node }}
          OLD_PACKAGE: ${{ runner.temp }}/agend-downgrade-baseline/lib/node_modules/@songsid/agend
        run: node scripts/check-data-downgrade.mjs "$OLD_PACKAGE" "$OLD_NODE" 2.3.3 | tee data-downgrade.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.src == 'true'
        with:
          name: data-downgrade-result
          path: data-downgrade.json

  verdict:
    name: Data downgrade compatibility
    runs-on: ubuntu-24.04
    needs: [data-downgrade]
    if: always()
    steps:
      - name: Require the complete proof
        env:
          RESULT: ${{ needs.data-downgrade.result }}
        run: test "$RESULT" = success
