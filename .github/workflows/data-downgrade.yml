name: Data downgrade compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an obsolete PR probe without cancelling branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  data-downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # #1819: the published 2.1.12 from one cached, integrity-checked tarball, not a registry download per run.
      - name: Published 2.1.12 tarball (cached, integrity-checked)
        id: baseline-tarball
        uses: ./.github/actions/published-agend-tarball
        with:
          version: 2.1.12
      - name: Install the published baseline in an isolated prefix
        id: baseline
        env:
          BASELINE_PREFIX: ${{ runner.temp }}/agend-downgrade-baseline
          BASELINE_TGZ: ${{ steps.baseline-tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "node=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
          bash scripts/ci/install-published-tarball.sh @songsid/agend "$BASELINE_TGZ" --prefix "$BASELINE_PREFIX"
          GOT="$(node -p 'require(process.argv[1]).version' "$BASELINE_PREFIX/lib/node_modules/@songsid/agend/package.json")"
          [ "$GOT" = 2.1.12 ] || { echo "::error::the baseline installed $GOT, expected 2.1.12"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # The version #2483's Mac recovery advice and #2481's auto-restore go back to: 2.2.6 must read what 2.3 wrote.
      - name: Published 2.2.6 tarball (cached, integrity-checked)
        id: baseline226-tarball
        uses: ./.github/actions/published-agend-tarball
        with:
          version: 2.2.6
      # Installed under Node 22, so its better-sqlite3 is built for the ABI of the Node it ships with (22.23.3), which
      # is the one that runs it: <prefix>/lib/node_modules/@songsid/agend/node_modules/@songsid/agend-node-linux-x64.
      - name: Install published 2.2.6 in an isolated prefix (its own bundled Node)
        id: baseline226
        env:
          BASELINE_PREFIX: ${{ runner.temp }}/agend-downgrade-baseline-226
          BASELINE_TGZ: ${{ steps.baseline226-tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          bash scripts/ci/install-published-tarball.sh @songsid/agend "$BASELINE_TGZ" --prefix "$BASELINE_PREFIX"
          PKG="$BASELINE_PREFIX/lib/node_modules/@songsid/agend"
          GOT="$(node -p 'require(process.argv[1]).version' "$PKG/package.json")"
          [ "$GOT" = 2.2.6 ] || { echo "::error::the baseline installed $GOT, expected 2.2.6"; exit 1; }
          NODE="$PKG/node_modules/@songsid/agend-node-linux-x64/bin/node"
          [ -x "$NODE" ] || { echo "::error::2.2.6's bundled Node is missing at $NODE"; exit 1; }
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
      - name: Build current stores
        run: npm ci && npm run build
      - name: A failed probe fails the workflow step
        shell: bash
        run: node scripts/check-data-downgrade-workflow.mjs
      - name: Current Node 22 → published 2.1.12 Node 20 → current Node 22
        id: roundtrip
        shell: bash
        env:
          OLD_NODE: ${{ steps.baseline.outputs.node }}
          OLD_PACKAGE: ${{ runner.temp }}/agend-downgrade-baseline/lib/node_modules/@songsid/agend
        run: node scripts/check-data-downgrade.mjs "$OLD_PACKAGE" "$OLD_NODE" 2.1.12 | tee data-downgrade.json
      - name: Current Node 22 → published 2.2.6 (bundled Node 22) → current Node 22
        id: roundtrip-226
        shell: bash
        env:
          OLD_NODE: ${{ steps.baseline226.outputs.node }}
          OLD_PACKAGE: ${{ runner.temp }}/agend-downgrade-baseline-226/lib/node_modules/@songsid/agend
        run: node scripts/check-data-downgrade.mjs "$OLD_PACKAGE" "$OLD_NODE" 2.2.6 | tee data-downgrade-226.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: data-downgrade-result
          path: |
            data-downgrade.json
            data-downgrade-226.json
