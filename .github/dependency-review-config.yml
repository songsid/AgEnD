# #2528 PR 3: licences in the root and website trees today (package.json
# license fields). A PR that introduces a high/critical advisory, or a
# licence not on this list, fails. Unknown licences are reported and do
# not fail (the action's rule).
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
allow-licenses:
  - "0BSD"
  - Apache-2.0
  - "Apache-2.0 AND LGPL-3.0-or-later AND MIT"
  # M-2457: the bundled tmux packages (@songsid/agend-tmux-*): tmux ISC, libevent BSD-3-Clause, ncurses X11, utf8proc
  # MIT AND Unicode-3.0 (musl MIT on Linux). The darwin 3.8.0-agend.2 packages as published still declare jemalloc's
  # BSD-2-Clause in their metadata (their binaries do not link it, #3308); the builder now derives the licence from the
  # linked parts, so the next repack drops that second line's need.
  - "ISC AND BSD-3-Clause AND X11 AND MIT AND Unicode-3.0"
  - "ISC AND BSD-3-Clause AND X11 AND MIT AND Unicode-3.0 AND BSD-2-Clause"
  - BSD-2-Clause
  - BSD-3-Clause
  - BlueOak-1.0.0
  - CC0-1.0
  - ISC
  - LGPL-2.1-or-later
  - LGPL-3.0-or-later
  - MIT
  - MPL-2.0
  - Python-2.0
