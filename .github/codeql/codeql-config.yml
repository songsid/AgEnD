# CodeQL configuration (codeql.yml passes it to init for every language).
#
# Test-only code is not scanned (the user, 2026-11-03): alerts there (URL-substring checks, identity replaces in
# assertions — #99, #100) are about how a test asserts, not about anything that runs in a user's AgEnD, and they kept
# the "Open alerts" gate red. Excluded:
#   - tests/**  — the unit and integration tests, their fixtures (tests/fixtures/**) and rigs;
#   - e2e/**    — the end-to-end harness: mock servers, VM setup and its Vitest config. Not in the package's `files`, and
#                 nothing under src/, scripts/ or launcher/ imports it.
# Everything else stays scanned: src/, scripts/ (including scripts/manual), launcher/, website/, docs/ and .github/.
name: AgEnD CodeQL config

paths-ignore:
  - tests/**
  - e2e/**
