<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgEnD docs screenshot frame</title>
<!--
  One framing for every docs screenshot (render.mts loads it with ?theme=light|dark&shot=<png>&w=<css px>&h=<css px>):
  the shot on a soft gradient, with rounded corners and a soft shadow — the README hero's look, without the phone.
-->
<style>
  :root { --bg-a: #eef4ff; --bg-b: #f7f1ff; --glow: rgba(10, 98, 194, .12); --edge: rgba(20, 40, 80, .10);
    --shadow: 0 24px 60px -18px rgba(22, 40, 80, .32), 0 6px 18px -8px rgba(22, 40, 80, .16); }
  :root[data-theme="dark"] { --bg-a: #0d1424; --bg-b: #1a1433; --glow: rgba(122, 183, 255, .14); --edge: rgba(255, 255, 255, .14);
    --shadow: 0 24px 70px -18px rgba(0, 0, 0, .7), 0 6px 18px -8px rgba(0, 0, 0, .5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; }
  body { background: radial-gradient(70% 60% at 20% 10%, var(--glow), transparent 70%), linear-gradient(135deg, var(--bg-a), var(--bg-b)); }
  .shot { position: absolute; left: 32px; top: 28px; border-radius: 14px; overflow: hidden; border: 1px solid var(--edge); box-shadow: var(--shadow); }
  .shot img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="shot"><img id="shot" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") === "dark" ? "dark" : "light";
  const w = Number(q.get("w")) || 1000, h = Number(q.get("h")) || 600;
  const box = document.querySelector(".shot");
  box.style.width = `${w}px`; box.style.height = `${h}px`;
  document.body.style.width = `${w + 64}px`; document.body.style.height = `${h + 56}px`;
  const img = document.getElementById("shot");
  img.onload = () => { document.fonts.ready.then(() => { window.frameReady = true; }); };
  img.src = q.get("shot") || "";
</script>
</body>
</html>
