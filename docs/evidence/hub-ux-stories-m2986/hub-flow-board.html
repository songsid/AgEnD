<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub 使用者故事流程板</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f26; --muted: #5d6675; --line: #dfe3ea; --soft: #eef1f5;
  --accent: #2f5fd0; --ok: #1f7a4d; --ok-bg: #e4f4ea; --blocker: #b3261e; --blocker-bg: #fbe6e4;
  --confusing: #a15c00; --confusing-bg: #fdf0d9; --polish: #4b5fa8; --polish-bg: #e8ebf8;
  --missing: #6a3fa0; --missing-bg: #efe6f8; --na: #7b8492; --na-bg: #eceef2; --pending: #0b6f7c; --pending-bg: #dcf2f4;
  --shadow: 0 1px 2px rgba(20,28,45,.08), 0 4px 14px rgba(20,28,45,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1d2128; --ink: #e7eaf0; --muted: #9aa3b2; --line: #2f3540; --soft: #252a33;
    --accent: #86a8ff; --ok: #6fd3a0; --ok-bg: #173526; --blocker: #ff8f86; --blocker-bg: #45201d;
    --confusing: #ffc56b; --confusing-bg: #43321a; --polish: #a9b6f5; --polish-bg: #262d4d;
    --missing: #cda8f5; --missing-bg: #35264a; --na: #8f98a6; --na-bg: #272c35; --pending: #7fd6e0; --pending-bg: #153a3f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
header.top { padding: 28px 24px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
header.top h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .01em; }
header.top p { margin: 0; color: var(--muted); max-width: 75ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--soft);
  color: var(--muted); font-size: 12.5px; max-width: 100%; overflow-wrap: anywhere; }
nav.toc { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; padding: 8px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
nav.toc a { flex: none; padding: 5px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
nav.toc a:hover { background: var(--soft); }
main { padding: 8px 24px 60px; }
section { margin-top: 30px; }
h2 { font-size: 19px; margin: 0 0 4px; }
h2 + .lead { margin: 0 0 14px; color: var(--muted); max-width: 80ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

/* summary numbers */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; }
.stat b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

/* matrix */
.scroll { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; font-size: 13px; }
table.matrix th, table.matrix td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
table.matrix thead th { background: var(--soft); font-weight: 600; text-align: center; }
table.matrix th.role { background: var(--panel); min-width: 110px; position: sticky; left: 0; z-index: 1; }
table.matrix td { min-width: 118px; }
.cell-tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.t-story { background: var(--ok-bg); color: var(--ok); }
.t-warn { background: var(--confusing-bg); color: var(--confusing); }
.t-impossible { background: var(--blocker-bg); color: var(--blocker); }
.t-oos { background: var(--na-bg); color: var(--na); }
.t-gap { background: var(--missing-bg); color: var(--missing); }
.cell-note { color: var(--muted); font-size: 12px; line-height: 1.45; }
.cell-note a { color: var(--accent); text-decoration: none; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); }

/* findings */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
ol.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.findings li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 16px; }
.rank { font-size: 20px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.f-title { font-weight: 600; }
.f-detail { color: var(--muted); margin: 2px 0 6px; max-width: 95ch; }
.f-fix { margin: 0 0 6px; max-width: 95ch; }
.f-fix b { font-weight: 600; }
.f-refs { display: flex; flex-wrap: wrap; gap: 6px; }
.sev { display: inline-block; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 8px; }
.s-blocker { background: var(--blocker-bg); color: var(--blocker); }
.s-confusing { background: var(--confusing-bg); color: var(--confusing); }
.s-polish { background: var(--polish-bg); color: var(--polish); }
.s-missing { background: var(--missing-bg); color: var(--missing); }
.s-ok { background: var(--ok-bg); color: var(--ok); }
.s-pending { background: var(--pending-bg); color: var(--pending); }
.c-gap { background: var(--blocker-bg); color: var(--blocker); } .c-decision { background: var(--missing-bg); color: var(--missing); } .c-polish { background: var(--polish-bg); color: var(--polish); }
.ref { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); text-decoration: none; }
a.ref { color: var(--accent); }

/* stories */
.role-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin: 34px 0 4px; }
.role-head h2 { margin: 0; }
.story { margin-top: 16px; padding: 16px 0 6px; }
.story-head { padding: 0 18px 12px; border-bottom: 1px solid var(--line); }
.story-head h3 { margin: 0 0 6px; font-size: 16.5px; }
.story-head h3 .sid { color: var(--accent); margin-right: 8px; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 22px; margin: 0; font-size: 13.5px; }
.facts div { display: grid; grid-template-columns: 5.5em 1fr; gap: 6px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.verdict { margin-top: 10px; font-size: 13.5px; }
.flow { display: flex; gap: 0; overflow-x: auto; padding: 16px 18px 14px; scroll-snap-type: x proximity; }
.step { flex: none; width: 272px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  display: flex; flex-direction: column; }
.step.st-blocker { border-color: var(--blocker); }
.step.st-missing { border-style: dashed; border-color: var(--missing); }
.step-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--soft);
  border-radius: 10px 10px 0 0; }
.step-n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--panel); font-size: 12px;
  font-weight: 700; display: grid; place-items: center; }
.step-screen { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.mock { margin: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; line-height: 1.55;
  min-height: 84px; white-space: pre-wrap; overflow-wrap: anywhere; }
.mock .btn { display: inline-block; margin: 4px 4px 0 0; padding: 1px 9px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent);
  font-size: 12.5px; white-space: nowrap; }
.step dl { margin: 0 10px 8px; font-size: 12.5px; }
.step dt { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.step dd { margin: 0; overflow-wrap: anywhere; }
.step-foot { margin-top: auto; padding: 8px 10px 10px; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; }
.arrow { flex: none; width: 30px; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
footer { padding: 20px 24px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
@media (max-width: 640px) { main { padding: 4px 16px 40px; } header.top { padding: 20px 16px 14px; } .step { width: 244px; } ol.findings li { grid-template-columns: 30px 1fr; } }
@media print { nav.toc, .filters { display: none; } .flow { flex-wrap: wrap; gap: 8px; } .arrow { display: none; } }
</style>
</head>
<body>
<header class="top">
  <h1>Hub 使用者故事流程板</h1>
  <p id="intro"></p>
  <div class="meta" id="meta"></div>
</header>
<nav class="toc" id="toc"></nav>
<main>
  <section id="overview"><h2>總覽</h2><p class="lead" id="overview-lead"></p><div class="stats" id="stats"></div></section>
  <section id="matrix"><h2>情境矩陣</h2><p class="lead">三種角色 × 自己 Fleet 的通道 × 是否綁定驗證器 × 帶來的 Agent。每格標示由哪個故事涵蓋，或為何不可能、不在範圍內。</p>
    <div class="card scroll"><table class="matrix" id="matrix-table"></table></div><div class="legend" id="legend"></div></section>
  <section id="findings"><h2>問題清單（依嚴重程度排序）</h2><p class="lead">每一項都已對照 alpha 最新原始碼確認，並標示處理方式：明顯缺漏直接修、需要決定的交給擁有者、其餘是打磨。點故事編號可跳到出現該問題的步驟。</p>
    <div class="filters" id="filters"></div><ol class="findings" id="finding-list"></ol></section>
  <div id="roles"></div>
</main>
<footer id="foot"></footer>
<script id="data" type="application/json">{"meta":{"intro":"從三種角色的角度寫下使用者故事，再一步一步對照 alpha 最新版的畫面原始碼與字串：每一步會看到什麼、有哪些按鈕、接著做什麼，以及這一步順不順。全部是讀原始碼得到的，沒有實際執行。","pills":["原始碼版本：release/2.3.5-alpha @ 53a08bd7（第二輪）","第一輪：8da18b33，13 個故事","2026-11-13","只讀原始碼，未實際執行","撰寫與走查：Argon、GrokCore、Sentinel 兩兩一組；加入碼由 Lumen 走查","彙整與查核：Lumen"],"overview":"連接與分享這條主線已經走得通，「讓同仁加入」三步驟卡片是最清楚的一段，加入碼也已經合併。第二輪新增四個加入碼故事：管理員這一側順，同仁這一側會卡住，因為 Fleet 的頁面沒有提到加入碼、也沒說碼要打在哪裡。第一輪的 13 個故事在新版本重新對照過，判定只有一步改變（加入碼從「沒有畫面」變成順利）。","footer":"方法：第一輪由三個 Agent 兩兩一組，各寫一個角色的故事並對照原始碼走查（8da18b33）；每一則引用的檔案與行號都由彙整者重新查核。第二輪（53a08bd7）新增加入碼的四個故事，並重新對照第一輪的 13 個故事：這段期間 Hub 與介面的原始碼只有 #3706、#3726、#3732 三個變更，原有故事引用的字串都沒有改動，判定不變；只有管理員故事 A3 的最後一步從「沒有畫面」改為順利。第一輪故事的行號維持 8da18b33 的位置；在 53a08bd7，panel-hub.js 登入表單之後的行號要加 8，settings-hub.js 加 3，hub-company-join.js 最多加 12。M-2988、M-2989、#3744 的修正在這次對照時都還沒合併，所以那些發現仍然存在，已標示派工的卡片。本頁沒有實際執行任何流程。"},"axes":{"channel":["只有 Web","Web + Discord","Web + Telegram"],"mfa":["已綁定驗證器","未綁定"],"agent":["Fleet Agent","ClassicBot 聊天室"]},"legend":{"story":"有故事，而且走得順","warn":"有故事，走得通但有令人困惑的步驟","impossible":"產品上做不到","oos":"這個角色不會遇到","gap":"有故事，但使用者需要的畫面不存在"},"findings":[{"sev":"confusing","cls":"gap","owner":"dev-claude2","title":"同仁的 Fleet 頁面沒有「加入碼」：不知道碼要打在哪裡","detail":"管理員複製出去的說明是「輸入 hub 位址和這組碼」，但 Fleet 的「設定 → Hub」只有一個「Hub 位址」欄位，整頁沒有提到加入碼。碼其實要接在位址後面、中間空一格。同仁會試的三種做法都失敗：整段貼上（「這不是 Hub 位址」）、只打碼（8 個字元被當成主機名稱，「連不上 abcd-efgh」）、只打位址（到 Hub 才被拒絕）。打對了，畫面也不會說「已帶入加入碼」。","fix":"提示改成「有加入碼就接在位址後面，中間空一格」；整段貼上時自動取出位址與碼；只打碼時說「這是加入碼，請在前面加上 Hub 位址」；認得碼之後在「找到…」那一行加上「已帶入加入碼」。","files":"src/ui/hub-join-one-strings.js:36,40,66,91-104、settings-hub-company-join.js:29,250-256。","stories":["J3"],"src":["src/ui/hub-join-one-strings.js:91-104","src/ui/settings-hub-company-join.js:250-256","src/ui/hub-enrolment-code-strings.js:30"],"isNew":true,"track":"這次新增"},{"sev":"confusing","cls":"decision","owner":"使用者決定","title":"靠加入碼進來的人，連上之後不能分享也不能提問","detail":"加入碼只給「連接 Fleet」。群組權限開啟時，不在允許群組的人靠碼連上後，沒有分享與對話的權限：Hub 首頁說「你的存取權不包含分享 Agent。」，但 Fleet 的頁面仍然請他「選擇要分享的 Agent」，而且 Fleet 端沒有對應這個情況的訊息。大量加入之後，會有一批連上了卻什麼都不能做的 Fleet。（Fleet 端實際顯示什麼，要實機確認。）","fix":"請決定：建立加入碼時可以一併勾選「和 Agent 對話」「分享 Agent」（安全代價：拿到碼的人權限變大），或維持只連接、並在 Fleet 頁面明講「你已連接，但還不能分享，請找 Hub 管理員」。","files":"","stories":["J3"],"src":["src/ui/hub-enrolment-code-strings.js:29","src/ui/hub-group-strings.js:97","src/ui/settings-hub.js:21-22"],"isNew":true,"track":"這次新增"},{"sev":"confusing","cls":"gap","owner":"Ridge","title":"加入碼到上限時，訊息說「Hub 目前忙碌」","detail":"最多 8 組有效的碼、每小時最多建立 10 組。超過時伺服器回的是「忙碌」，畫面顯示「Hub 目前忙碌，請稍後再試。」加上重試。8 組的情況等再久也沒用，要先停用一組。","fix":"伺服器分開回報兩種上限；畫面分別說「最多 8 組有效的加入碼，請先停用一組」與「一小時內建立太多組，請晚點再試」。","files":"src/hub/enrolment-code.ts:131、src/ui/hub-enrolment-code.js:11、hub-enrolment-code-strings.js。","stories":["J1"],"src":["src/hub/enrolment-code.ts:131","src/ui/hub-enrolment-code.js:11,113"],"isNew":true,"track":"這次新增"},{"sev":"confusing","cls":"gap","owner":"Ridge","title":"「立即停用這組碼」沒有確認，停用後也沒有任何說明","detail":"一按就停用，不能復原，而且會中斷正在連接的人。Hub 其他的撤銷都有確認框。「加入碼已停用，已連接的 Fleet 不受影響。」這句話已經寫在字串裡，但沒有被顯示。","fix":"加確認框（寫明：這組碼不能再用、正在連接的 n 台會中斷、已連接的不受影響），停用後顯示那一句。","files":"src/ui/hub-enrolment-code.js:104-116,136、hub-enrolment-code-strings.js:37。","stories":["J2"],"src":["src/ui/hub-enrolment-code.js:136","src/ui/hub-enrolment-code-strings.js:37","src/hub/join/service.ts:186-190"],"isNew":true,"track":"這次新增"},{"sev":"confusing","cls":"gap","owner":"Ridge","title":"連接到一半，加入碼被停用：訊息說「本機授權已變更」","detail":"管理員停用加入碼時，正在連接的請求會以「authority」結束，同仁看到「本機授權已變更，這次連接已停止。請先到 Hub 檢查結果，再重新操作。」，和真正的原因無關。","fix":"用加入碼自己的結束原因（code-ended），顯示「加入碼已失效或已用完。」。","files":"src/hub/join/service.ts:189、src/ui/hub-company-join-strings.js:44。","stories":["J3"],"src":["src/hub/join/service.ts:189","src/ui/hub-company-join-strings.js:44"],"isNew":true,"track":"這次新增"},{"sev":"polish","cls":"polish","owner":"Ridge","title":"排隊時沒有進度","detail":"「目前很多人同時加入，正在排隊…」會持續最長約 50 秒（最多 8 次、每次 2–6 秒），沒有第幾次或大約多久。另有一個沒被使用的字串「再試一次」。","fix":"加上「第 n 次，共 8 次」或「大約一分鐘內」；刪掉沒用到的字串。","files":"src/ui/panel-hub.js:240、hub-company-join.js:113、hub-enrolment-code-strings.js:39。","stories":["J4"],"src":["src/ui/hub-join-queue.js:37-42","src/ui/hub-enrolment-code-strings.js:39"],"isNew":true,"track":"這次新增"},{"sev":"blocker","title":"帶 ClassicBot 聊天室的人無法分享，畫面也沒說為什麼","detail":"「分享的 Agent」只列出 Fleet 的 Agent，ClassicBot 聊天室不在清單裡。只有聊天室的人會看到「這個 Fleet 還沒有 Agent。」，然後就沒有下一步。情境矩陣有一半因此做不到。","fix":"先在這一頁寫明「目前只能分享 Fleet Agent，ClassicBot 聊天室還不行」；要不要支援聊天室是產品決定。","stories":[],"src":["src/ui/settings-hub.js:254","src/fleet-manager.ts:2315-2316","src/hub/member/exposure-api.ts:82-91"],"cls":"gap","owner":"dev-claude2","files":"在「分享的 Agent」加一句說明並改空白狀態的文字：src/ui/settings-hub.js:254、hub-strings.js:145、hub-agent-copy.js:14。要不要支援聊天室另外決定。","track":"M-2988（文字）；#3743 第 1 項（支援聊天室）"},{"sev":"missing","title":"主管不是一個角色：團隊名單、申請核准、用量都沒有畫面","detail":"Hub 只有管理員與 Agent 擁有者。主管看不到團隊誰加入了（進不了「管理」），同仁沒有地方申請提問，也沒有依同仁或團隊的用量。","fix":"先決定主管要不要成為產品角色。最小的一步：給群組負責人一個唯讀的團隊檢視（誰已連接、誰問過）。","stories":["M2","M3","M4"],"src":["src/ui/panel-hub.js:821-838,874","src/ui/hub-quota.js:19-21"],"cls":"decision","owner":"使用者決定","files":"","track":"#3743 第 2 項：角色與權限設計（M-2990，已決定）"},{"sev":"missing","title":"允許提問只能一次一位、打確切的登入名稱","detail":"沒有搜尋，也不能依 AD 群組或部門授權；最長 90 天。十個人的團隊要輸入十次，到期再來一次。管理員那邊已經可以搜尋群組，這裡還不行。","fix":"沿用「讓同仁加入」的群組搜尋，讓擁有者可以允許一個 AD 群組提問；至少提供姓名搜尋。","stories":["M1","U4"],"src":["src/ui/panel-hub.js:844-868","src/ui/hub-owner-strings.js:32-33"],"cls":"decision","owner":"使用者決定","files":"","track":"#3743 第 3 項（已決定要做）"},{"sev":"missing","title":"加入碼還不在 alpha 裡","detail":"「讓同仁加入」的步驟 3 已經留了位置，但加入碼的建立與管理畫面在 #3706，尚未合併。大量加入目前只能靠 AD 群組。","fix":"#3706 合併後補走這一段。","stories":["A3"],"src":["src/ui/hub-join-steps.js:64-77"],"cls":"gap","owner":"Ridge","files":"已在進行：#3706（feat/hub-enrolment-code-ui-b2）。","track":"已解決：#3706 已合併，見 J1–J4"},{"sev":"missing","title":"Hub 登入只有密碼一道","detail":"Hub（包含管理員）只用公司帳號與密碼登入。使用者在自己 Fleet 綁的驗證器保護不到 Hub，所以「是否綁定驗證器」只影響自己的儀表板。","fix":"這是安全上的取捨，請擁有者決定：維持（靠 AD 的政策），或為 Hub 管理員加第二道驗證。","stories":["A5","A3"],"src":["src/ui/panel-hub.js:220","src/ui/hub-strin <script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var SEV = { blocker: "阻擋", confusing: "令人困惑", polish: "可再打磨", missing: "沒有畫面", ok: "順利", pending: "尚未合併" };
  var CLS = { gap: "明顯缺漏，直接修", decision: "需要決定", polish: "打磨" };
  var CELL = { story: "有故事", warn: "可行但卡關", impossible: "不可能", oos: "不在範圍", gap: "產品缺口" };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
  function sevTag(s) { return el("span", "sev s-" + s, SEV[s] || s); }
  function link(id, text) { var a = el("a", "ref", text || id); a.href = "#" + id; return a; }

  document.getElementById("intro").textContent = D.meta.intro;
  D.meta.pills.forEach(function (p) { document.getElementById("meta").appendChild(el("span", "pill", p)); });
  document.getElementById("overview-lead").textContent = D.meta.overview;
  document.getElementById("foot").textContent = D.meta.footer;

  var toc = document.getElementById("toc");
  [["overview", "總覽"], ["matrix", "情境矩陣"], ["findings", "問題清單"]].concat(D.roles.map(function (r) { return ["role-" + r.id, r.name]; }))
    .forEach(function (t) { var a = el("a", "", t[1]); a.href = "#" + t[0]; toc.appendChild(a); });

  // stats
  var steps = 0, counts = { ok: 0, blocker: 0, confusing: 0, polish: 0, missing: 0 }, stories = 0;
  D.roles.forEach(function (r) { r.stories.forEach(function (s) { stories++; s.steps.forEach(function (x) { steps++; counts[x.status] = (counts[x.status] || 0) + 1; }); }); });
  [[stories, "個使用者故事"], [steps, "個步驟逐一對照原始碼"], [counts.ok, "步順利"], [counts.blocker + counts.missing, "步被阻擋或沒有畫面"], [counts.confusing, "步令人困惑"], [counts.polish, "步可再打磨"]]
    .forEach(function (s) { var c = el("div", "card stat"); add(c, el("b", "", String(s[0])), el("span", "", s[1])); document.getElementById("stats").appendChild(c); });

  // matrix
  var CH = D.axes.channel, MF = D.axes.mfa, AG = D.axes.agent, T = document.getElementById("matrix-table");
  var thead = el("thead"), r1 = el("tr"), r2 = el("tr"), r3 = el("tr");
  var corner = el("th", "role", "角色"); corner.rowSpan = 3; r1.appendChild(corner);
  CH.forEach(function (c) { var th = el("th", "", c); th.colSpan = MF.length * AG.length; r1.appendChild(th);
    MF.forEach(function (m) { var t2 = el("th", "", m); t2.colSpan = AG.length; r2.appendChild(t2); AG.forEach(function (a) { r3.appendChild(el("th", "", a)); }); }); });
  add(thead, r1, r2, r3); T.appendChild(thead);
  var tb = el("tbody");
  D.roles.forEach(function (r) {
    var tr = el("tr"); var th = el("th", "role"); add(th, link("role-" + r.id, r.name)); tr.appendChild(th);
    for (var c = 0; c < CH.length; c++) for (var m = 0; m < MF.length; m++) for (var a = 0; a < AG.length; a++) {
      var cell = (r.matrix || []).filter(function (x) { return x.c === c && x.m === m && x.a === a; })[0] || { status: "oos", note: "" };
      var td = el("td"); td.appendChild(el("span", "cell-tag t-" + cell.status, CELL[cell.status])); var n = el("div", "cell-note");
      (cell.stories || []).forEach(function (id) { var l = el("a", "", id); l.href = "#story-" + id; n.appendChild(l); n.appendChild(document.createTextNode(" ")); });
      if (cell.note) n.appendChild(document.createTextNode(cell.note)); td.appendChild(n); tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  T.appendChild(tb);
  Object.keys(CELL).forEach(function (k) { var s = el("span"); add(s, el("span", "cell-tag t-" + k, CELL[k]), document.createTextNode(" " + D.legend[k])); document.getElementById("legend").appendChild(s); });

  // findings
  var list = document.getElementById("finding-list"), fwrap = document.getElementById("filters"), active = "all";
  function drawFindings() {
    list.textContent = "";
    D.findings.forEach(function (f, i) {
      if (active !== "all" && f.sev !== active) return;
      var li = el("li", "card"); li.id = "finding-" + (i + 1);
      var body = el("div"); var t = el("div", "f-title"); add(t, sevTag(f.sev), f.isNew ? el("span", "sev s-pending", "第二輪新增") : null, document.createTextNode(f.title));
      var refs = el("div", "f-refs"); (f.stories || []).forEach(function (s) { refs.appendChild(link("story-" + s, s)); });
      (f.src || []).forEach(function (s) { refs.appendChild(el("span", "ref mono", s)); });
      var fix = null; if (f.fix) { fix = el("p", "f-fix"); add(fix, el("b", "", "建議："), document.createTextNode(f.fix)); }
      var own = el("p", "f-fix"); add(own, el("span", "sev c-" + f.cls, CLS[f.cls] || f.cls), el("b", "", "建議負責："), document.createTextNode(f.owner + (f.files ? "　修改位置：" + f.files : "") + (f.track && !f.isNew ? "　目前：" + f.track : "")));
      add(body, t, el("p", "f-detail", f.detail), fix, f.cls ? own : null, refs); add(li, el("div", "rank", String(i + 1)), body); list.appendChild(li);
    });
  }
  [["all", "全部"], ["blocker", SEV.blocker], ["missing", SEV.missing], ["confusing", SEV.confusing], ["polish", SEV.polish]].forEach(function (f) {
    var n = f[0] === "all" ? D.findings.length : D.findings.filter(function (x) { return x.sev === f[0]; }).length; if (!n) return;
    var b = el("button", "", f[1] + " " + n); b.type = "button"; b.setAttribute("aria-pressed", String(f[0] === active));
    b.onclick = function () { active = f[0]; [].forEach.call(fwrap.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); }); drawFindings(); };
    fwrap.appendChild(b);
  });
  drawFindings();

  // stories
  var roles = document.getElementById("roles");
  D.roles.forEach(function (r) {
    var sec = el("section"); sec.id = "role-" + r.id;
    var head = el("div", "role-head"); add(head, el("h2", "", r.name), el("span", "pill", "撰寫與走查：" + r.pair)); sec.appendChild(head);
    sec.appendChild(el("p", "lead", r.lead)); sec.querySelector("p.lead").style.color = "var(--muted)"; sec.querySelector("p.lead").style.margin = "0";
    r.stories.forEach(function (s) {
      var card = el("article", "card story"); card.id = "story-" + s.id;
      var sh = el("div", "story-head"), h3 = el("h3"); add(h3, el("span", "sid", s.id), document.createTextNode(s.title));
      if (s.pending) h3.appendChild(document.createTextNode(" ")), h3.appendChild(sevTag("pending"));
      var dl = el("dl", "facts");
      [["誰", s.who], ["想做到", s.goal], ["從哪裡開始", s.entry], ["成功標準", s.success], ["涵蓋情境", s.cells]].forEach(function (f) {
        if (!f[1]) return; var d = el("div"); add(d, el("dt", "", f[0]), el("dd", "", f[1])); dl.appendChild(d); });
      var worst = s.steps.some(function (x) { return x.status === "blocker"; }) ? "blocker" : s.steps.some(function (x) { return x.status === "missing"; }) ? "missing"
        : s.steps.some(function (x) { return x.status === "confusing"; }) ? "confusing" : s.steps.some(function (x) { return x.status === "polish"; }) ? "polish" : "ok";
      var v = el("div", "verdict"); add(v, sevTag(worst), document.createTextNode(s.verdict || "")); add(sh, h3, dl, v); card.appendChild(sh);
      var flow = el("div", "flow");
      s.steps.forEach(function (x, i) {
        if (i) flow.appendChild(el("div", "arrow", "→"));
        var st = el("div", "step st-" + x.status); st.id = "step-" + s.id + "-" + (i + 1);
        var top = el("div", "step-top"); add(top, el("span", "step-n", String(i + 1)), el("span", "step-screen", x.screen)); st.appendChild(top);
        var mock = el("div", "mock"); if (x.text) mock.appendChild(document.createTextNode(x.text + (x.buttons && x.buttons.length ? "\n" : "")));
        (x.buttons || []).forEach(function (b) { mock.appendChild(el("span", "btn", b)); }); st.appendChild(mock);
        var d = el("dl"); if (x.action) add(d, el("dt", "", "使用者接著做"), el("dd", "", x.action));
        if (x.src) { add(d, el("dt", "", "原始碼")); var dd = el("dd", "mono", x.src); d.appendChild(dd); } st.appendChild(d);
        var foot = el("div", "step-foot"); add(foot, sevTag(x.status)); if (x.pending) foot.appendChild(sevTag("pending"));
        if (x.note) foot.appendChild(document.createTextNode(x.note)); st.appendChild(foot); flow.appendChild(st);
      });
      card.appendChild(flow); sec.appendChild(card);
    });
    roles.appendChild(sec);
  });
})();
</script>
