# AgEnD with Docker Compose (#581). From this directory:
#   docker compose up -d                       # first start installs the CLIs fleet.yaml uses
#   docker compose exec agend agend web --code # a one-time code for the dashboard: http://localhost:19280
# Settings and tokens go in .env next to this file (see docs/docker.md). Update: docker compose pull && docker compose up -d
name: agend
services:
  agend:
    image: ghcr.io/songsid/agend:${AGEND_TAG:-latest}
    build:
      context: .
      args:
        AGEND_PACKAGE: ${AGEND_PACKAGE:-@songsid/agend@latest}
    restart: unless-stopped
    # The fleet stops its instances gracefully before it exits.
    stop_grace_period: 2m
    env_file:
      - path: .env
        required: false
    ports:
      # Host-local, as on a normal install. To reach it from another machine, change the host address on purpose
      # and add that name to web.allowed_hosts.
      - "127.0.0.1:${AGEND_PORT:-19280}:19280"
    volumes:
      - agend-home:/home/agend
      - agend-work:/work
volumes:
  agend-home:
  agend-work:
