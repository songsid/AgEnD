title = "AgEnD gitleaks configuration"

[extend]
useDefault = true

# Single [allowlist] table, not [[allowlists]]: the gitleaks-action pins gitleaks
# 8.24.3, which silently ignores the plural form (added in 8.25), so entries
# written that way never applied in CI. A finding is allowed if it matches any
# of the paths or regexes below.
[allowlist]
description = "Confirmed false positives: a fake JWT fixture, public WebSocket handshake nonces, vendored xterm.js, the pinned nodejs/release-keys commit"
paths = [
  # Known fake JWT used to verify progress-log redaction
  '''^tests/tool-progress\.test\.ts$''',
  # Vendored third-party xterm.js (minified high-entropy strings, not secrets)
  '''^src/ui/web-terminal/vendor/.*\.js$''',
]
# Sec-WebSocket-Key is a public protocol field (base64 nonce in an HTTP header), not a secret.
# Matched against the finding's own match text, not the whole line: with
# regexTarget = "line" any real key that merely shares a line with the words
# "Sec-WebSocket-Key" (a trailing comment, a neighbouring header) would be hidden too.
# The match must be the header field followed by exactly a 16-byte nonce (22 base64
# chars + "=="); gitleaks' generic match may carry a stray leading word character
# and a trailing quote, ";" or a literal \r / \n, which the tail allows.
regexTarget = "match"
regexes = [
  '''(?i)sec-websocket-key["'\x60]?\s*[:=]\s*["'\x60]?[A-Za-z0-9+/]{22}==(?:\\[nr]|["'\x60;\s])?$''',
  # #1450: the nodejs/release-keys commit the runtime build pins its signing keyring to — a public git SHA (40 hex),
  # matched only as this exact constant (the rule fires on "KEYS" in the name).
  '''^RELEASE_KEYS_COMMIT = "[0-9a-f]{40}"$''',
]
