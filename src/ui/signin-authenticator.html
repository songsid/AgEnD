<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>AgEnD — Sign in with an authenticator</title>
<!--app-icon-->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 64x64">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<!--/app-icon-->
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/tokens.css">
<style>
  /* TEMPORARY (#3486): the minimum page the core needs to be tried by hand. The leader's sign-in page replaces it — it only has to POST
     {code} to /auth/totp (see docs/SECURITY.md). Same tokens as the sign-in page; nothing else is shared. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font: var(--fw-regular) var(--fs-md)/var(--lh-md) var(--font-ui); -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px 24px; }
  .brand { margin: 0 0 18px; font-size: var(--fs-lg); font-weight: var(--fw-bold); }
  h1 { margin: 0 0 6px; font-size: var(--fs-xl); font-weight: var(--fw-semibold); }
  p { margin: 0 0 18px; color: var(--text-2); }
  label { display: block; margin: 12px 0 6px; font-size: var(--fs-sm); color: var(--text-2); font-weight: var(--fw-medium); }
  input { width: 100%; padding: 12px; font: 600 20px/1 var(--font-mono); text-align: center; background: var(--bg); color: var(--text);
          border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
  #code { letter-spacing: .18em; }
  input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-dim); }
  button { width: 100%; margin-top: 14px; padding: 12px; font: var(--fw-semibold) var(--fs-md) var(--font-ui); color: var(--on-accent); background: var(--accent-fill);
           border: 0; border-radius: var(--r-full); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 1.5em; margin-top: 14px; font-size: var(--fs-sm); color: var(--danger); }
  .hint { margin-top: 18px; font-size: var(--fs-xs); color: var(--text-3); }
  .back { display: block; margin-top: 12px; font-size: var(--fs-sm); color: var(--text-2); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="signin-card">
  <div class="brand">AgEnD</div>
  <form id="form" autocomplete="off">
    <h1 data-i18n="title">Sign in with your authenticator</h1>
    <p data-i18n="lead">Type the 6-digit code from the authenticator app you set up in AgEnD.</p>
    <label for="code" data-i18n="code">6-digit code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" placeholder="123456" required>
    <button id="go" type="submit" data-i18n="submit">Sign in</button>
    <div id="msg" role="alert" aria-live="polite"></div>
    <div class="hint" data-i18n="hint">No authenticator yet? Use the sign-in code from chat instead.</div>
    <a class="back" href="/signin" data-i18n="back">Use a sign-in code instead</a>
  </form>
</main>
<script src="/assets/signin-authenticator.js"></script>
</body>
</html>
