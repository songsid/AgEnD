<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>AgEnD — Sign in</title>
<style>
  :root { --bg:#080b12; --panel:#161b22; --border:#30363d; --fg:#f0f6fc; --dim:#8b949e; --accent:#2AABEE; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px 24px; }
  h1 { margin:0 0 6px; font-size:20px; }
  p { margin:0 0 18px; color:var(--dim); }
  label { display:block; margin-bottom:6px; font-size:13px; color:var(--dim); }
  input { width:100%; padding:12px; font:600 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.18em; text-align:center;
          text-transform:uppercase; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:14px; padding:12px; font:600 15px system-ui, sans-serif; color:#04121b; background:var(--accent);
           border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:1.5em; margin-top:14px; font-size:14px; color:var(--err); }
  .hint { margin-top:18px; font-size:12px; color:var(--dim); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="checking" data-i18n="checking">Checking your session…</div>
  <form id="form" hidden autocomplete="off">
    <h1 data-i18n="title">Sign in to AgEnD</h1>
    <p data-i18n="lead">Enter the one-time code from your chat channel.</p>
    <label for="code" data-i18n="label">One-time code</label>
    <input id="code" name="code" inputmode="text" autocomplete="one-time-code" autocapitalize="characters"
           autocorrect="off" spellcheck="false" maxlength="12" placeholder="XXXX-XXXX" required>
    <button id="go" type="submit" data-i18n="submit">Sign in</button>
    <div id="msg" role="alert" aria-live="polite"></div>
    <div class="hint" data-i18n="hint">Send /dashboard to your AgEnD bot, or run “agend web --code” on the host. A code works once and expires in 5 minutes.</div>
  </form>
  <noscript>This page needs JavaScript to sign you in.</noscript>
</main>
<script src="/assets/signin.js"></script>
</body>
</html>
