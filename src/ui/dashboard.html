<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AgEnD Dashboard</title>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/agend-auth.js"></script>
<script src="/assets/shell.js" defer></script>
<style>
  /* ── Theme tokens (#1307) ───────────────────────────────
     Semantic names only: a rule says what a colour is FOR (surface, muted text, a user's bubble), never which
     colour it is. Dark is the default; light follows the device (prefers-color-scheme) unless this browser chose
     one (data-theme, set by /assets/theme.js before paint). Every text/surface pair is WCAG AA (4.5:1) or better. */
  :root {
    color-scheme: dark;
    --bg: #0d1117; --sidebar: #010409; --surface: #161b22; --raised: #1f2630; --panel: #161b22;
    --border: #30363d; --border-strong: #484f58;
    --text: #e6edf3; --text-sec: #9ea7b3; --text-muted: #7d8590;
    --accent: #2aabee; --accent-dim: rgba(42,171,238,0.12); --accent-line: rgba(42,171,238,0.35);
    --on-accent: #ffffff; --accent-fill: #0b72b5;
    --success: #3fb950; --error: #f85149; --warn: #d29922;
    --success-fill: #238636; --warn-fill: #9a6700; --danger-fill: #b62324;
    --user-bubble: #1c2a3a; --user-bubble-border: #26405a;
    --code-bg: #010409; --code-head: #161b22; --inline-code: rgba(110,118,129,0.25); --th-bg: rgba(110,118,129,0.15);
    --tk-k: #ff7b72; --tk-s: #a5d6ff; --tk-n: #79c0ff; --tk-c: #8b949e;
    --warn-bg: rgba(210,153,34,0.12); --warn-line: rgba(210,153,34,0.45);
    --error-bg: rgba(248,81,73,0.12); --error-line: rgba(248,81,73,0.4);
    --scrim: rgba(1,4,9,0.7); --shadow: 0 8px 28px rgba(0,0,0,0.45);
    --focus: #58a6ff;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --col: 820px;        /* the conversation column */
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #ffffff; --sidebar: #f6f8fa; --surface: #ffffff; --raised: #eef1f4; --panel: #ffffff;
      --border: #d0d7de; --border-strong: #afb8c1;
      --text: #1f2328; --text-sec: #4b535d; --text-muted: #636c76;
      --accent: #0969da; --accent-dim: rgba(9,105,218,0.08); --accent-line: rgba(9,105,218,0.35);
      --on-accent: #ffffff; --accent-fill: #0969da;
      --success: #1a7f37; --error: #cf222e; --warn: #9a6700;
      --success-fill: #1a7f37; --warn-fill: #9a6700; --danger-fill: #cf222e;
      --user-bubble: #ddf4ff; --user-bubble-border: #b6e3ff;
      --code-bg: #f6f8fa; --code-head: #eaeef2; --inline-code: rgba(175,184,193,0.3); --th-bg: #f6f8fa;
      --tk-k: #cf222e; --tk-s: #0a3069; --tk-n: #0550ae; --tk-c: #636c76;
      --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --error-bg: #ffebe9; --error-line: #ff8182;
      --scrim: rgba(31,35,40,0.45); --shadow: 0 8px 24px rgba(140,149,159,0.3);
      --focus: #0969da;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --sidebar: #f6f8fa; --surface: #ffffff; --raised: #eef1f4; --panel: #ffffff;
    --border: #d0d7de; --border-strong: #afb8c1;
    --text: #1f2328; --text-sec: #4b535d; --text-muted: #636c76;
    --accent: #0969da; --accent-dim: rgba(9,105,218,0.08); --accent-line: rgba(9,105,218,0.35);
    --on-accent: #ffffff; --accent-fill: #0969da;
    --success: #1a7f37; --error: #cf222e; --warn: #9a6700;
    --success-fill: #1a7f37; --warn-fill: #9a6700; --danger-fill: #cf222e;
    --user-bubble: #ddf4ff; --user-bubble-border: #b6e3ff;
    --code-bg: #f6f8fa; --code-head: #eaeef2; --inline-code: rgba(175,184,193,0.3); --th-bg: #f6f8fa;
    --tk-k: #cf222e; --tk-s: #0a3069; --tk-n: #0550ae; --tk-c: #636c76;
    --warn-bg: #fff8c5; --warn-line: #d4a72c;
    --error-bg: #ffebe9; --error-line: #ff8182;
    --scrim: rgba(31,35,40,0.45); --shadow: 0 8px 24px rgba(140,149,159,0.3);
    --focus: #0969da;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--text-muted); }
  .small { font-size: 11px; }
  [hidden] { display: none !important; }

  /* ── Sidebar: collapsible (#1307) ────────────────────── */
  .sidebar {
    width: 272px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--sidebar); border-right: 1px solid var(--border);
  }
  body.sb-collapsed .sidebar { display: none; }
  .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 16px 12px 12px 18px; }
  .sidebar-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .sidebar-header .uptime { flex: 1; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .sidebar-pad { padding: 4px 12px 0; }
  .icon-btn {
    background: transparent; border: 1px solid transparent; color: var(--text-sec); cursor: pointer;
    border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--raised); color: var(--text); }
  .nav-section {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    padding: 16px 20px 6px;
  }
  .fleet-entry {
    padding: 8px 10px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 13px; color: var(--text); border: 1px solid transparent;
  }
  .fleet-entry:hover { background: var(--raised); }
  .fleet-entry.active { background: var(--accent-dim); border-color: var(--accent-line); }
  .instance-list { flex: 1; overflow-y: auto; padding: 2px 0; }
  .instance-item {
    margin: 1px 12px; padding: 8px 10px; cursor: pointer;
    border-radius: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid transparent;
  }
  .instance-item:hover { background: var(--raised); }
  .instance-item.active { background: var(--accent-dim); border-color: var(--accent-line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-muted); }
  .dot.running { background: var(--success); }
  .dot.stopped { background: var(--error); opacity: 0.8; }
  .dot.crashed { background: var(--warn); }
  .inst-identity { flex: 1; min-width: 0; }
  .inst-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst-alias { margin-top: 2px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst-meta { flex-shrink: 0; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .theme-pick { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-sec); }
  .theme-pick select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit; }

  /* ── Main: a top bar, then the view ──────────────────── */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .topbar .sb-open { display: none; }
  body.sb-collapsed .topbar .sb-open { display: inline-flex; }
  .top-title { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .no-sel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-muted); }
  .no-sel svg { opacity: 0.3; }
  .no-sel span { font-size: 15px; font-weight: 500; }

  /* ── Tabs ─────────────────────────────────────────────── */
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 6px 12px; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 500;
    color: var(--text-sec); background: transparent; border: 0; font-family: inherit;
  }
  .tab:hover { color: var(--text); background: var(--raised); }
  .tab.active { color: var(--accent); background: var(--accent-dim); }

  /* ── Action buttons ──────────────────────────────────── */
  .actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .actions:empty { display: none; }
  .btn {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; line-height: 1.4;
    cursor: pointer; border: 1px solid var(--border); font-family: inherit; color: var(--text); background: var(--surface);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--raised); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-accent { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
  .btn-accent:hover:not(:disabled) { background: var(--accent-fill); filter: brightness(1.1); border-color: transparent; }
  .btn-green { background: var(--success-fill); color: #fff; border-color: transparent; }
  .btn-warn { background: var(--warn-fill); color: #fff; border-color: transparent; }
  .btn-red { background: var(--danger-fill); color: #fff; border-color: transparent; }
  .btn-green:hover:not(:disabled), .btn-warn:hover:not(:disabled), .btn-red:hover:not(:disabled) { filter: brightness(1.1); border-color: transparent; }
  .btn-ghost { background: transparent; color: var(--text-sec); border-color: transparent; }
  .btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--raised); }
  .btn-ghost.btn-red { background: transparent; color: var(--error); }
  .btn-sm { padding: 4px 8px; }

  /* ── Toast ───────────────────────────────────────────── */
  .toasts { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  .toast {
    padding: 10px 16px; max-width: min(420px, calc(100vw - 32px));
    border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 100; color: #fff; box-shadow: var(--shadow);
    animation: toastIn 0.25s ease-out;
  }
  .toast.ok { background: var(--success-fill); }
  .toast.err { background: var(--danger-fill); }
  @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ── Chat: a centred column, the composer pinned below (#1307) ── */
  .chat-view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .thread { max-width: var(--col); margin: 0 auto; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 18px; }
  .msg { font-size: 14px; line-height: 1.6; word-break: break-word; min-width: 0; }
  .msg .meta { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .msg .sender { font-weight: 600; color: var(--text-sec); }
  .msg .time { font-family: var(--font-mono); font-size: 11px; }
  /* The person's own messages: a bubble on the right. */
  .msg.user { align-self: flex-end; max-width: min(80%, 640px); }
  .msg.user .meta { justify-content: flex-end; }
  .msg.user .body { background: var(--user-bubble); border: 1px solid var(--user-bubble-border); border-radius: 18px 18px 4px 18px; padding: 10px 14px; }
  /* An agent's reply: the full column, no box. */
  .msg.agent { align-self: stretch; }
  .msg.agent .sender { color: var(--success); }
  .msg-tools { display: flex; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity 0.12s; }
  .msg:hover .msg-tools, .msg:focus-within .msg-tools { opacity: 1; }
  @media (hover: none) { .msg-tools { opacity: 0.8; } }
  .chip-btn {
    background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; border-radius: 6px;
    font: inherit; font-size: 12px; padding: 2px 8px;
  }
  .chip-btn:hover { color: var(--text); background: var(--raised); border-color: var(--border); }
  .chip-btn.icon-only { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; }
  .chip-btn.icon-only.done::after { content: "✓"; color: var(--success); }
  .chip-btn.icon-only.fail::after { content: "!"; color: var(--error); }
  .msg-empty { color: var(--text-muted); text-align: center; margin-top: 80px; font-size: 14px; line-height: 2; }
  .msg-empty svg { display: block; margin: 0 auto 12px; opacity: 0.3; }
  .msg-empty .sub { font-size: 12px; }
  .jump-latest {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px); z-index: 5;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow);
    padding: 6px 14px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .jump-latest:hover { border-color: var(--border-strong); }
  .composer-wrap { flex-shrink: 0; padding: 0 20px 14px; }
  .composer-col { max-width: var(--col); margin: 0 auto; position: relative; }
  .composer {
    display: flex; align-items: flex-end; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 18px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  .composer:focus-within { border-color: var(--accent-line); }
  .composer textarea {
    flex: 1; background: transparent; color: var(--text); border: 0; padding: 7px 6px; outline: none;
    font: inherit; font-size: 14px; resize: none; min-height: 22px; max-height: 240px; line-height: 1.5; overflow-y: auto;
  }
  .composer .icon-btn { width: 34px; height: 34px; }
  .send-btn { border-radius: 999px; min-width: 64px; justify-content: center; padding: 8px 14px; }
  .input-hint { font-size: 11px; color: var(--text-muted); padding: 6px 4px 0; text-align: center; }
  .prompts:empty, .work-bar:empty, #failedSend:empty { display: none; }
  .prompt { margin-bottom: 8px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--warn-bg); border: 1px solid var(--warn-line); }
  .prompt.done { background: transparent; border-style: dashed; color: var(--text-muted); }
  .prompt .txt { white-space: pre-wrap; word-break: break-word; }
  .prompt .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .prompt .wait { font-size: 12px; color: var(--text-muted); }
  .work-bar { display: none; }
  .work-bar.on { display: flex; gap: 8px; align-items: center; margin: 0 4px 8px; font-size: 12px; color: var(--text-sec); }
  .work-bar .lbl { flex: 1; }
  .work-bar .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: agendPulse 1.2s ease-in-out infinite; }
  .work-bar.stuck .pulse, .work-bar.awaiting .pulse { background: var(--warn); animation: none; }
  .work-bar.stopping .pulse { background: var(--text-muted); }
  .work-bar .elapsed { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .work-bar.awaiting { color: var(--text); }
  .work-bar .note { color: var(--text-muted); font-size: 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge-await { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .drop-overlay { display: none; }
  .chat-view.dragging .drop-overlay {
    display: flex; position: absolute; inset: 8px; z-index: 20; align-items: center; justify-content: center; pointer-events: none;
    border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--bg) 82%, transparent);
  }
  .drop-card { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; font-size: 15px; }
  .drop-card svg { width: 32px; height: 32px; }
  @keyframes agendPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .work-bar .pulse { animation: none; } .toast { animation: none; } }
  .tick { margin-left: 4px; font-size: 11px; }
  .tick-delivered { color: var(--success); }
  .tick-failed { color: var(--error); font-weight: 700; }
  .tick-cancelled { color: var(--text-muted); }
  .failed-send { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; font-size: 12px; background: var(--error-bg); border: 1px solid var(--error-line); display: flex; gap: 8px; align-items: center; }
  .failed-send .txt { flex: 1; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
  .pending-files { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 8px; }
  .pending-files:empty { display: none; }
  .file-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); max-width: 320px; }
  .file-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .file-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .file-chip .sz { color: var(--text-muted); flex-shrink: 0; }
  .file-chip .ic { display: inline-flex; color: var(--text-sec); }
  .file-chip .as-text { white-space: nowrap; flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-sec); cursor: pointer; font: inherit; font-size: 11px; padding: 1px 6px; }
  .file-chip .as-text:hover { color: var(--text); border-color: var(--border-strong); }
  .file-chip button { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 13px; }
  .msg .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .msg.user .atts { justify-content: flex-end; }
  .msg .att-img img { max-width: 260px; max-height: 220px; border-radius: 8px; display: block; border: 1px solid var(--border); }
  .msg .att-file { font-size: 12px; color: var(--accent); }
  .msg .att-size { color: var(--text-muted); }

  /* Rendered Markdown inside a message */
  .msg .md { white-space: normal; }
  .msg .md p { margin: 0 0 8px; } .msg .md p:last-child { margin-bottom: 0; }
  .msg .md code { font-family: var(--font-mono); font-size: 0.9em; background: var(--inline-code); border-radius: 4px; padding: 1px 4px; }
  .msg .md a { color: var(--accent); }
  .msg .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--border-strong); color: var(--text-sec); }
  .msg .md ul, .msg .md ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg .md li > ul, .msg .md li > ol { margin: 2px 0; }
  .msg .md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg .md .tbl { overflow-x: auto; margin: 8px 0; }
  .msg .md table { border-collapse: collapse; font-size: 13px; }
  .msg .md th, .msg .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
  .msg .md th { background: var(--th-bg); font-weight: 600; }
  .msg .md .al-c { text-align: center; } .msg .md .al-r { text-align: right; }
  .msg .md h3, .msg .md h4, .msg .md h5, .msg .md h6 { margin: 10px 0 6px; font-size: 14px; }
  .msg .md .tk-k { color: var(--tk-k); } .msg .md .tk-s { color: var(--tk-s); } .msg .md .tk-n { color: var(--tk-n); } .msg .md .tk-c { color: var(--tk-c); font-style: italic; }
  /* Code blocks: a header with the language, Wrap and Copy; a long one is folded until opened. */
  .codeblock { margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .codeblock .cb-head {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px 12px; background: var(--code-head);
    border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-sec); position: sticky; top: 0;
  }
  .codeblock .cb-lang { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
  .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }

async function answerPrompt(p, action) {

  catch (err) { r = { error: err && err.message ? err.message : tr("disconnected") }; }

const TICK_LABELS = () => ({ queued: tr("tick_queued"), processing: tr("tick_processing"), delivered: tr("tick_delivered"), failed: tr("tick_failed"), cancelled: tr("tick_cancelled") });
// "<name> is working…" and a Stop for the reply under way — built from nodes: the name is text, never markup.
function renderWorkBar() {

  renderComposerButtons();
  const busy = AgendChatRender.isBusy(activity[cur]) ? activity[cur] : "";

  const kind = !cur ? "" : wait != null ? "awaiting" : stopping[cur] && busy ? "stopping" : busy;
  // Every status frame comes through here: rebuild only on a change; the elapsed time ticks in place.
  const shown = `${cur}\u0000${kind}\u0000${wait ?? ""}`;
  if (bar.dataset.shown !== shown) {
    bar.dataset.shown = shown;
    bar.textContent = ""; elapsedEl = null;
    if (!kind) { bar.className = "work-bar"; }

      bar.className = kind === "working" ? "work-bar on" : `work-bar on ${kind}`;

      const label = document.createElement("span"); label.className = "lbl";

      bar.append(dot, label);

        const note = document.createElement("span"); note.className = "note"; note.textContent = wait || tr("approxNote");
        note.title = tr("approxNote"); bar.append(note);

        bar.append(t); elapsedEl = t;

async function cancelReply(target, button) {

    if (AgendChatRender.isBusy(activity[target])) {

function growComposer(inp) { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 240) + "px"; }
async function sendMsg() {
  const inp = document.getElementById("msgIn"), txt = inp.value.trim();
  const target = cur;                                  // the chat this message belongs to, whatever is on screen later
  const files = (pendingFiles[target] || []).slice();
  if ((!txt && !files.length) || !target || sending[target]) return;
  sending[target] = true;
  inp.value = ""; drafts[target] = ""; growComposer(inp);
  pendingFiles[target] = []; inFlightFiles[target] = files; renderPendingFiles();
  if (target === cur) jumpLatest();          // your own message: the view goes to it
  let r;
  try {
    // Each file goes up on its own (the server reads its type from the bytes and stores it in the
    // instance's inbox), then the message names them by the ids it got back.
    const ids = [];
    for (const f of files) ids.push((await uploadFile(target, f)).id);
    r = await api("POST", "/ui/send", ids.length ? { instance: target, message: txt, attachments: ids } : { instance: target, message: txt });
  } catch (err) { r = { error: err && err.message ? err.message : tr("disconnected") }; }
  sending[target] = false;
  delete inFlightFiles[target];
  if (r && !r.error) return;
  // Not delivered: never lose anything. The files go back to that chat's pending list, in front of any added
  // meanwhile — which always fit, because addFiles counted these as taken while they were in flight; the text goes back into its own composer if that is on screen
  // and empty, otherwise it is kept for its chat and offered back.
  if (files.length) {
    pendingFiles[target] = AgendChatRender.checkFiles(files, pendingFiles[target] || []).kept;
    if (target === cur) renderPendingFiles();
  }
  if (txt) {
    const now = document.getElementById("msgIn");
    if (AgendChatRender.settleFailedSend(target, cur, !!now, now ? now.value : "") === "restore") {
      now.value = txt; drafts[target] = txt; growComposer(now);
    } else {
      failedSends[target] = failedSends[target] ? failedSends[target] + "\n" + txt : txt;
      if (target === cur) renderFailedSend();
    }
  }
  toast(r && r.error ? r.error : tr("disconnected"), false);
}
/** One file up to the fleet; resolves to {id, …} or throws with the server's reason. */
async function uploadFile(target, file) {

    method: "POST",
    headers: { "Content-Type": file.type || "application/octet-stream", "X-Agend-Filename": encodeURIComponent(file.name || "file") },
    body: file,
  });

  try { body = await r.json(); } catch { /* not JSON */ }
  if (!r.ok || !body || typeof body.id !== "string") throw new Error(body && body.error ? `${file.name}: ${body.error}` : `${file.name}: upload failed (${r.status})`);

}

          <button class="btn btn-ghost btn-red" data-act="delSchedule" data-arg="${escAttr(s.id)}">Delete</button>
        </div></div>`;
    }
    el.innerHTML = h;
  } catch { el.innerHTML = `<div class="load-error">${tr("loadFailed")}</div>`; }
}
async function delSchedule(id) {
  if (!confirm(tr("deleteSchedule"))) return;
  const r = await api("DELETE", `/ui/schedules/${id}`);
  if (r.error) toast(r.error, false); else { toast(tr("scheduleDeleted")); loadSchedules(); }
}
function showCreateSchedule() {
  const ov = document.createElement("div"); ov.className = "form-overlay";
  const tgtOpts = instances.map(i => `<option value="${esc(i.name)}">${esc(i.name)}</option>`).join("");
  ov.innerHTML = `<div class="form-card"><h2>Create Schedule</h2>
    <div class="form-field"><label>Cron Expression *</label><input id="cs-cron" placeholder="0 9 * * 1-5"></div>
    <div class="form-field"><label>Message *</label><input id="cs-msg" placeholder="What to send"></div>
    <div class="form-field"><label>Target Instance *</label><select id="cs-target">${tgtOpts}</select></div>
    <div class="form-field"><label>Label</label><input id="cs-label" placeholder="Daily standup"></div>
    <div class="form-actions"><button class="btn btn-ghost" data-act="closeOverlay">Cancel</button>
    <button class="btn btn-accent" id="cs-go">Create</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  ov.querySelector("#cs-go").addEventListener("click", async () => {
    const cron = document.getElementById("cs-cron").value.trim();
    const msg = document.getElementById("cs-msg").value.trim();
    const target = document.getElementById("cs-target").value;
    if (!cron || !msg || !target) { toast(tr("scheduleFieldsRequired"), false); return; }
    const btn = ov.querySelector("#cs-go"); btn.disabled = true; btn.textContent = tr("creating");
    const body = { cron, message: msg, target, source: "web-user", reply_chat_id: "", reply_thread_id: "" };
    const label = document.getElementById("cs-label").value.trim(); if (label) body.label = label;
    const r = await api("POST", "/ui/schedules", body);
    if (r.error) { toast(r.error, false); btn.disabled = false; btn.textContent = tr("create"); }
    else { toast(tr("scheduleCreated")); ov.remove(); loadSchedules(); }
  });
}

// ── Teams ────────────────────────────────────────────────
async function loadTeams() {
  const el = document.getElementById("teamView"); if (!el) return;
  try {
    const d = await api("GET", "/ui/teams");
    const teams = d.teams || {};
    const entries = Object.entries(teams);
    let h = `<div class="list-header"><span>${entries.length} teams</span>
      <button class="btn btn-accent" data-act="showCreateTeam">+ New Team</button></div>`;
    if (!entries.length) h += `<div class="msg-empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>No teams yet<br><span class="sub">Group instances for coordinated work</span></div>`;
    else for (const [name, team] of entries) {
      h += `<div class="task-item">
        <span class="task-title strong">${esc(name)}</span>
        <span class="task-assignee">${esc((team.members||[]).join(", "))}</span>
        <div class="task-actions">
          <button class="btn btn-ghost btn-red" data-act="delTeam" data-arg="${escAttr(name)}">Delete</button>
        </div></div>`;
    }
    el.innerHTML = h;
  } catch { el.innerHTML = `<div class="load-error">${tr("loadFailed")}</div>`; }
}
async function delTeam(name) {
  if (!confirm(trf("deleteTeam", name))) return;
  const r = await api("DELETE", `/ui/teams/${encodeURIComponent(name)}`);
  if (r.error) toast(r.error, false); else { toast(tr("teamDeleted")); loadTeams(); }
}
function showCreateTeam() {
  const ov = document.createElement("div"); ov.className = "form-overlay";
  const memOpts = instances.map(i => `<label class="check-row"><input type="checkbox" value="${esc(i.name)}">${esc(i.name)}</label>`).join("");
  ov.innerHTML = `<div class="form-card"><h2>Create Team</h2>
    <div class="form-field"><label>Team Name *</label><input id="ct2-name" placeholder="team-name"></div>
    <div class="form-field"><label>Description</label><input id="ct2-desc" placeholder="What this team does"></div>
    <div class="form-field"><label>Members *</label><div id="ct2-members" class="check-list">${memOpts}</div></div>
    <div class="form-actions"><button class="btn btn-ghost" data-act="closeOverlay">Cancel</button>
    <button class="btn btn-accent" id="ct2-go">Create</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  ov.querySelector("#ct2-go").addEventListener("click", async () => {
    const name = document.getElementById("ct2-name").value.trim();
    const members = [...document.querySelectorAll("#ct2-members input:checked")].map(c => c.value);
    if (!name || !members.length) { toast(tr("teamFieldsRequired"), false); return; }
    const btn = ov.querySelector("#ct2-go"); btn.disabled = true; btn.textContent = tr("creating");
    const body = { name, members };
    const desc = document.getElementById("ct2-desc").value.trim(); if (desc) body.description = desc;
    const r = await api("POST", "/ui/teams", body);
    if (r.error) { toast(r.error, false); btn.disabled = false; btn.textContent = tr("create"); }
    else { toast(tr("teamCreated")); ov.remove(); loadTeams(); }
  });
}

// ── Cron description ─────────────────────────────────────
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function cronDesc(expr) {
  if (!expr) return "";
  const p = expr.trim().split(/\s+/);
  if (p.length < 5) return expr;
  const [min, hr, dom, mon, dow] = p;
  const time = (hr !== "*" && min !== "*") ? `at ${hr.padStart(2,"0")}:${min.padStart(2,"0")}` : "";
  if (min === "*" && hr === "*") return "Every minute";
  if (min.startsWith("*/")) return `Every ${min.slice(2)} minutes`;
  if (hr.startsWith("*/")) return `Every ${hr.slice(2)} hours`;
  if (dom === "*" && mon === "*" && dow === "*") return `Daily ${time}`;
  if (dom === "*" && mon === "*" && dow === "1-5") return `Weekdays ${time}`;
  if (dom === "*" && mon === "*" && dow !== "*") {
    const days = dow.split(",").map(d => { const n = parseInt(d); return isNaN(n) ? d : (DAYS[n] || d); });
    return `${days.join(", ")} ${time}`;
  }
  if (dom !== "*" && mon === "*") return `${dom}${dom==="1"?"st":dom==="2"?"nd":dom==="3"?"rd":"th"} of month ${time}`;
  return expr;
}

// ── Config form ──────────────────────────────────────────
let cfgData = null;
async function loadConfig() {
  const el = document.getElementById("configView"); if (!el) return;
  try {
    cfgData = await api("GET", "/ui/config");
    const ch = cfgData.channel || {};
    const acc = ch.access || {};
    const defs = cfgData.defaults || {};
    const roots = cfgData.project_roots || [];
    el.innerHTML = `
      <div class="card"><h3>Channel</h3>
        <div class="form-field"><label>Type</label><input id="cfg-type" value="${esc(ch.type||"")}" disabled></div>
        <div class="form-field"><label>Bot Token Env</label><input id="cfg-token-env" value="${esc(ch.bot_token_env||"AGEND_BOT_TOKEN")}" disabled></div>
        <div class="form-field"><label>Group ID</label>
          <div class="field-row">
            <input id="cfg-gid" type="password" value="${escAttr(ch.group_id||"")}">
            <button class="eye-btn" data-act="togglePw" data-arg="cfg-gid">&#128065;</button>
          </div></div>
      </div>
      <div class="card"><h3>Access Control</h3>
        <div class="form-field"><label>Mode</label>
          <select id="cfg-acc-mode"><option value="locked" ${acc.mode==="locked"?"selected":""}>Locked</option><option value="open" ${acc.mode==="open"?"selected":""}>Open</option></select></div>
        <div class="form-field"><label>Allowed Users</label>
          <div class="field-row">
            <input id="cfg-users" type="password" value="${escAttr((acc.allowed_users||[]).join(", "))}">
            <button class="eye-btn" data-act="togglePw" data-arg="cfg-users">&#128065;</button>
          </div>
          <div class="field-note">Comma-separated user IDs</div></div>
      </div>
      <div class="card"><h3>Defaults</h3>
        <div class="form-field"><label>Backend</label>
          <select id="cfg-backend">
            ${["claude-code","codex","opencode","kiro-cli","antigravity","grok","gemini-cli"].map(b => `<option value="${escAttr(b)}" ${defs.backend===b?"selected":""}>${b === "gemini-cli" ? "gemini-cli (deprecated)" : b}</option>`).join("")}
          </select></div>
      </div>
      <div class="card"><h3>Project Roots</h3>
        <div id="cfg-roots">${roots.map((r,i) => `<div class="root-row"><input class="cfg-root" value="${esc(r)}"><button class="btn btn-ghost btn-sm" data-act="removeParent">&#10005;</button></div>`).join("")}</div>
        <button class="btn btn-ghost" data-act="addRoot">+ Add Root</button>
      </div>
      <div class="save-row">
        <button class="btn btn-accent" data-act="saveConfig">Save Changes</button>
        <span class="muted small">Saving will reformat fleet.yaml (comments will be lost)</span>
      </div>`;
  } catch { el.innerHTML = `<div class="load-error">${tr("configLoadFailed")}</div>`; }
}
function togglePw(id) { const el = document.getElementById(id); el.type = el.type === "password" ? "text" : "password"; }
function addRoot() { const el = document.getElementById("cfg-roots"); el.insertAdjacentHTML("beforeend", `<div class="root-row"><input class="cfg-root" value="" placeholder="/path/to/projects"><button class="btn btn-ghost btn-sm" data-act="removeParent">&#10005;</button></div>`); }
async function saveConfig() {
  const body = {
    channel: { group_id: document.getElementById("cfg-gid").value.trim(), access: { mode: document.getElementById("cfg-acc-mode").value, allowed_users: document.getElementById("cfg-users").value.split(",").map(s => s.trim()).filter(Boolean) } },
    defaults: { backend: document.getElementById("cfg-backend").value },
    project_roots: [...document.querySelectorAll(".cfg-root")].map(i => i.value.trim()).filter(Boolean),
  };
  const r = await api("POST", "/ui/config", body);
  if (r.error) toast(r.error, false);
  else { toast(tr("configSaved") + (r.needs_restart ? tr("configRestart") : "")); }
}
