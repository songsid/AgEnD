<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AgEnD Dashboard</title>
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/agend-auth.js"></script>
<script src="/assets/shell.js" defer></script>
<style>
  :root {
    --bg: #080b12; --surface: rgba(22,27,34,0.7); --raised: rgba(28,33,41,0.8);
    --border: rgba(48,54,61,0.6); --border-bright: rgba(48,54,61,0.9);
    --text: #f0f6fc; --text-sec: #8b949e; --text-muted: #484f58;
    --accent: #2AABEE; --accent-dim: rgba(42,171,238,0.08); --accent-glow: rgba(42,171,238,0.2);
    --success: #56d364; --error: #f85149; --warn: #d29922;
    --glass: rgba(22,27,34,0.55); --glass-border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; height: 100vh;
    background-image:
      radial-gradient(ellipse 120% 80% at 10% 20%, rgba(42,171,238,0.04), transparent 50%),
      radial-gradient(ellipse 80% 60% at 90% 80%, rgba(86,211,100,0.03), transparent 50%);
  }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
  }
  .sidebar-header {
    padding: 24px 20px 20px;
    background: linear-gradient(135deg, rgba(42,171,238,0.08) 0%, transparent 60%);
    border-bottom: 1px solid var(--glass-border);
  }
  .sidebar-header h1 {
    font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800;
    letter-spacing: -0.03em; color: var(--text);
    background: linear-gradient(135deg, var(--text) 60%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sidebar-header .uptime {
    font-size: 11px; color: var(--text-muted); margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em;
  }
  .nav-section {
    font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted);
    padding: 16px 20px 8px;
  }
  .fleet-entry {
    margin: 0 12px; padding: 10px 12px; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; gap: 10px;
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 13px;
    color: var(--accent); transition: all 0.15s;
    border: 1px solid transparent;
  }
  .fleet-entry:hover { background: var(--accent-dim); }
  .fleet-entry.active { background: var(--accent-dim); border-color: rgba(42,171,238,0.2); box-shadow: 0 0 20px rgba(42,171,238,0.06); }
  .instance-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .instance-item {
    margin: 2px 12px; padding: 10px 12px; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; gap: 10px;
    transition: all 0.15s; border: 1px solid transparent;
  }
  .instance-item:hover { background: var(--raised); }
  .instance-item.active { background: var(--accent-dim); border-color: rgba(42,171,238,0.15); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    transition: box-shadow 0.3s;
  }
  .dot.running { background: var(--success); box-shadow: 0 0 8px rgba(86,211,100,0.5); }
  .dot.stopped { background: var(--error); opacity: 0.7; }
  .dot.crashed { background: var(--warn); }
  .inst-identity { flex: 1; min-width: 0; }
  .inst-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst-alias { margin-top: 2px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst-meta { flex-shrink: 0; font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--glass-border); }

  /* ── Main ────────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .no-sel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-muted); }
  .no-sel svg { opacity: 0.15; }
  .no-sel span { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }

  /* ── Tabs ─────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 2px; padding: 8px 16px;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-border);
  }
  .tab {
    padding: 8px 16px; cursor: pointer; border-radius: 8px;
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--text-muted); transition: all 0.15s;
  }
  .tab:hover { color: var(--text-sec); background: rgba(255,255,255,0.03); }
  .tab.active { color: var(--accent); background: var(--accent-dim); }

  /* ── Action buttons ──────────────────────────────────── */
  .actions { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--glass-border); }
  .btn {
    padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); font-family: 'DM Sans', sans-serif;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-accent { background: var(--accent); color: #fff; border-color: transparent; }
  .btn-accent:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(42,171,238,0.3); }
  .btn-green { background: rgba(35,134,54,0.9); color: #fff; border-color: transparent; }
  .btn-green:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(35,134,54,0.3); }
  .btn-warn { background: rgba(158,106,3,0.9); color: #fff; border-color: transparent; }
  .btn-warn:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(158,106,3,0.3); }
  .btn-red { background: rgba(218,54,51,0.9); color: #fff; border-color: transparent; }
  .btn-red:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(218,54,51,0.3); }
  .btn-ghost { background: transparent; color: var(--text-sec); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--raised); }

  /* ── Toast ───────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
    border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 100;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid var(--glass-border);
  }
  .toast.ok { background: rgba(35,134,54,0.85); color: #fff; }
  .toast.err { background: rgba(218,54,51,0.85); color: #fff; }
  @keyframes toastIn { from { transform: translateY(16px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

  /* ── Chat ─────────────────────────────────────────────── */
  .chat-view { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 78%; padding: 12px 16px; border-radius: 16px;
    font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.inbound {
    align-self: flex-end; border-bottom-right-radius: 4px;
    background: linear-gradient(135deg, rgba(42,171,238,0.12), rgba(42,171,238,0.06));
    border: 1px solid rgba(42,171,238,0.1);
  }
  .msg.outbound {
    align-self: flex-start; border-bottom-left-radius: 4px;
    background: var(--surface); border: 1px solid var(--glass-border);
    border-left: 2px solid var(--success);
  }
  .msg .sender { font-size: 11px; font-weight: 600; margin-bottom: 4px; font-family: 'Outfit', sans-serif; }
  .msg .sender.user { color: var(--accent); }
  .msg .sender.agent { color: var(--success); }
  .msg .time { font-size: 10px; color: var(--text-muted); float: right; margin-left: 12px; font-family: 'IBM Plex Mono', monospace; }
  .msg-empty { color: var(--text-muted); text-align: center; margin-top: 80px; font-size: 13px; line-height: 2; }
  .msg-empty svg { display: block; margin: 0 auto 12px; opacity: 0.15; }
  .input-bar { padding: 16px 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 8px; }
  .input-bar { align-items: flex-end; }
  .input-bar textarea {
    flex: 1; background: rgba(255,255,255,0.04); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 16px;
    font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    resize: none; min-height: 20px; max-height: 240px; line-height: 1.5; overflow-y: auto;
  }
  .input-bar textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .prompts { margin: 0 20px; }
  .prompt { margin-bottom: 8px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: rgba(210,153,34,0.12); border: 1px solid rgba(210,153,34,0.4); }
  .prompt.done { background: transparent; border-style: dashed; color: var(--text-muted); }
  .prompt .txt { white-space: pre-wrap; word-break: break-word; }
  .prompt .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .prompt .wait { font-size: 12px; color: var(--text-muted); }
  .work-bar { display: none; }
  .work-bar.on { display: flex; gap: 8px; align-items: center; margin: 0 20px 8px; font-size: 12px; color: var(--text-muted); }
  .work-bar .lbl { flex: 1; }
  .work-bar .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: agendPulse 1.2s ease-in-out infinite; }
  .work-bar.stuck .pulse { background: var(--warn); animation: none; }
  @keyframes agendPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .work-bar .pulse { animation: none; } }
  .tick { margin-left: 6px; font-size: 11px; }
  .tick-delivered { color: var(--success); }
  .tick-failed { color: var(--error); font-weight: 700; }
  .tick-cancelled { color: var(--text-muted); }
  .failed-send { margin: 0 20px 8px; padding: 8px 12px; border-radius: 10px; font-size: 12px; background: rgba(218,54,51,0.12); border: 1px solid rgba(218,54,51,0.35); display: flex; gap: 8px; align-items: center; }
  .failed-send .txt { flex: 1; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
  .pending-files { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 6px; }
  .pending-files:empty { display: none; }
  .file-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--surface); max-width: 260px; }
  .file-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .file-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip button { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 13px; }
  .chat-view.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .msg .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .msg .att-img img { max-width: 260px; max-height: 220px; border-radius: 8px; display: block; border: 1px solid var(--glass-border); }
  .msg .att-file { font-size: 12px; color: var(--accent); }
  .msg .att-size { color: var(--text-muted); }
  .input-hint { font-size: 11px; color: var(--text-muted); padding: 0 20px 8px; }
  /* Rendered Markdown inside a message */
  .msg .md { white-space: normal; }
  .msg .md p { margin: 0 0 6px; } .msg .md p:last-child { margin-bottom: 0; }
  .msg .md pre { white-space: pre; overflow-x: auto; background: rgba(0,0,0,0.35); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .msg .md code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: rgba(255,255,255,0.06); border-radius: 4px; padding: 1px 4px; }
  .msg .md pre code { background: none; padding: 0; }
  .msg .md a { color: var(--accent); }
  .msg .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--glass-border); color: var(--text-muted); }
  .msg .md ul, .msg .md ol { margin: 4px 0; padding-left: 20px; }
  .msg .md h3, .msg .md h4, .msg .md h5, .msg .md h6 { margin: 6px 0 4px; font-size: 13px; }

  /* ── Detail cards ────────────────────────────────────── */
  .detail-view { flex: 1; overflow-y: auto; padding: 24px; display: none; }
  .card {
    background: var(--surface); border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }
  .card:hover { border-color: rgba(255,255,255,0.1); }
  .card h3 {
    font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 14px;
  }
  .detail-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; }
  .detail-label { color: var(--text-muted); min-width: 100px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  /* Readable at a glance: the percentage is bold and the bar thick (usage readability). */
  .progress-bar { display: inline-block; width: 120px; height: 8px; background: rgba(255,255,255,0.07); border-radius: 4px; vertical-align: middle; margin-left: 10px; overflow: hidden; }
  .progress-fill { display: block; height: 100%; border-radius: 4px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .pct-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .activity-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: 'IBM Plex Mono', monospace; }
  .act-time { color: var(--text-muted); margin-right: 8px; }
  .act-event { color: var(--warn); margin-right: 4px; }

  /* ── List items (tasks, schedules, teams) ─────────────── */
  .task-view { flex: 1; overflow-y: auto; padding: 24px; display: none; }
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .list-header span { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15px; }
  .task-item {
    background: var(--surface); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all 0.15s;
  }
  .task-item:hover { border-color: rgba(255,255,255,0.08); transform: translateY(-1px); }
  .task-status {
    font-size: 10px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
    font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .task-status.open { background: var(--accent-dim); color: var(--accent); }
  .task-status.claimed { background: rgba(210,153,34,0.12); color: var(--warn); }
  .task-status.done { background: rgba(86,211,100,0.1); color: var(--success); }
  .task-title { flex: 1; font-size: 13px; font-weight: 500; }
  .task-assignee { font-size: 11px; color: var(--text-sec); }
  .task-actions { display: flex; gap: 4px; }

  /* ── Form overlay ────────────────────────────────────── */
  .form-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .form-card {
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 32px; width: 480px; max-width: 92vw; max-height: 82vh;
    overflow-y: auto; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }
  .form-card h2 {
    font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700;
    margin-bottom: 24px; letter-spacing: -0.02em;
  }
  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block; font-size: 11px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em;
    font-family: 'Outfit', sans-serif;
  }
  .form-field input, .form-field select {
    width: 100%; background: rgba(255,255,255,0.04); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none;
    transition: all 0.15s;
  }
  .form-field input:focus, .form-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
  .eye-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 4px 6px; border-radius: 6px; transition: all 0.15s; }
  .eye-btn:hover { color: var(--accent); }

  @media (max-width: 700px) { .sidebar { width: 240px; } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>AgEnD</h1>
    <div class="uptime" id="uptime">--</div>
  </div>
  <div style="padding:8px 12px 0"><nav data-agend-nav data-compact data-current="ui"></nav></div>
  <div style="padding:8px 12px 0">
    <div class="fleet-entry" id="fleetEntry" onclick="selFleet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Fleet
    </div>
  </div>
  <div class="nav-section">Instances</div>
  <div class="instance-list" id="instanceList"></div>
  <div class="sidebar-footer">
    <button class="btn btn-accent" style="width:100%;justify-content:center" onclick="showCreateInstance()">+ New Instance</button>
  </div>
</div>

<div class="main" id="mainArea">
  <div class="no-sel">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    <span>Select Fleet or an instance to begin</span>
  </div>
</div>

<script src="/ui/js/chat-render.js"></script>
<script>
// No token in the URL: signing in with a one-time code set an HttpOnly session cookie,
// which the browser attaches to these same-origin requests on its own.
const UI_LANG = localStorage.getItem("agend_lang") || (navigator.language?.toLowerCase().startsWith("zh") ? "zh-TW" : "en");
const UI_TEXT = {
  en: {
    disconnected: "disconnected", tick_queued: "Waiting behind another message", tick_processing: "Handed to the agent", tick_delivered: "The agent has it", tick_failed: "Not delivered", tick_cancelled: "Dropped by Stop",
    promptAnswering: "Answering…", promptGone: "This prompt is no longer open", promptFor: "{0}: {1}",
    working: "{0} is working…", stuck: "{0} looks stuck", stopReply: "Stop", stopReplyTitle: "Stop the current reply (like Esc) and drop the messages still waiting", stopSent: "Stopped",
    file_empty: "empty file", file_too_large: "over 10 MB", file_too_many: "at most 5 files per message", file_too_much: "the files together would be over 25 MB", removeFile: "Remove", notSent: "Not sent:", putBack: "Put back", discard: "Discard", selectTarget: "Select Fleet or an instance to begin", deleteConfirm: 'Type "delete {0}" to confirm:',
    instanceDeleted: "Instance deleted", noMessages: "No messages yet", sendFirst: "Send a message to start the conversation",
    loadFailed: "Failed to load", configLoadFailed: "Failed to load config", topicRequired: "Topic Name is required when Directory is empty",
    titleRequired: "Title required", scheduleFieldsRequired: "Cron, message, and target required", teamFieldsRequired: "Name and at least one member required",
    deleteSchedule: "Delete this schedule?", deleteTeam: 'Delete team "{0}"?', creating: "Creating...", create: "Create",
    instanceCreated: "Instance created", taskCreated: "Task created", scheduleCreated: "Schedule created", scheduleDeleted: "Schedule deleted",
    teamCreated: "Team created", teamDeleted: "Team deleted", configSaved: "Config saved", configRestart: " (restart Fleet to apply channel changes)",
  },
  "zh-TW": {
    disconnected: "已斷線", tick_queued: "排在前一則訊息之後", tick_processing: "已交給 agent", tick_delivered: "agent 已收到", tick_failed: "未送達", tick_cancelled: "已被中止取消",

const tr = key => UI_TEXT[UI_LANG]?.[key] || UI_TEXT.en[key] || key;
const trf = (key, ...values) => values.reduce((text, value, index) => text.replaceAll(`{${index}}`, String(value)), tr(key));
let cur = null, curTab = "chat", mode = "none", instances = [];
// mode: "none" | "fleet" | "instance"
const msgs = {};
// Per target, independent of the DOM (the chat view is re-rendered often): what is being typed, and

const drafts = {}, failedSends = {};

async function api(m, p, b) {

function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtUp(s) { return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s/60)}m` : `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`; }
function toast(msg, ok=true) {

}

// Live updates arrive over SSE. Some paths cannot carry it (Cloudflare Quick Tunnels do not), and a proxy
// that buffers a stream looks to the page exactly like a server that never sends — so a stream that says

let lastCursor = "", silentTimer = null, errorTimer = null, pollTimer = null;
function applyStatus(d) {

  // "awaiting_input" (#1212), which must not hide the working line and Stop between two events.
  for (const i of instances) activity[i.name] = (i.execution_state !== undefined ? i.execution_state : i.state) ?? null;
  document.getElementById("uptime").textContent = fmtUp(d.uptime);

// One way in for a chat message, from the stream, a poll or a replay: one entry per boot+id.
function ingestMessage(m) {

  if (m.instance === cur && curTab === "chat") renderMsgs();
}
async function pollOnce() {
  try {
    const r = await fetch(`/ui/poll?after=${encodeURIComponent(lastCursor)}`, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    applyStatus(d.status);
    for (const m of d.messages) ingestMessage(m);
    if (typeof d.cursor === "string") lastCursor = d.cursor;
    // Ticks move on messages already shown, which a cursor does not cover: the poll carries them. (Re-reading the
    // chat's history instead would count as the person's activity and keep an idle session alive.)
    applyDeliveries(d.deliveries);

function startPolling() { if (pollTimer) return; pollOnce(); pollTimer = setInterval(pollOnce, 5000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function sseAlive() { stopPolling(); clearTimeout(errorTimer); errorTimer = null; clearTimeout(silentTimer); silentTimer = setTimeout(startPolling, 30000); }

const sse = new EventSource("/ui/events");

sse.addEventListener("status", e => { sseAlive(); applyStatus(JSON.parse(e.data)); });
sse.addEventListener("message", e => {

// A web user's message got further (or a Stop dropped it): its ticks.
function applyDeliveries(list) {
  if (!Array.isArray(list)) return;
  let redraw = false;
  for (const d of list) {
    if (!d || typeof d.instance !== "string") continue;
    const before = msgs[d.instance];
    msgs[d.instance] = AgendChatRender.applyDelivery(before, d.messageId, d.delivery);
    if (msgs[d.instance] !== before && d.instance === cur) redraw = true;

sse.addEventListener("delivery", e => { sseAlive(); applyDeliveries([JSON.parse(e.data)]); });

sse.addEventListener("deliveries", e => { sseAlive(); applyDeliveries(JSON.parse(e.data)); });
sse.addEventListener("prompt", e => {

// What was said before this page loaded (a reload no longer starts from an empty chat).
async function loadHistory(name) {

    if (!r || !Array.isArray(r.messages)) return;

async function doAction(a) {

    const r = await api("POST", `/ui/instances/${encodeURIComponent(cur)}/delete`, { confirm: c });

    toast(`${cur}: ${tr("instanceDeleted")}`); cur = null;
    document.getElementById("mainArea").innerHTML = `<div class="no-sel"><span>${tr("instanceDeleted")}</span></div>`;

  }
  const ep = `/ui/${a}/${encodeURIComponent(cur)}`;

function renderMsgs() {

  el.innerHTML = m.map(x => {
    const u = x.sender==="web-user"||(!x.sender.startsWith("agend")&&x.sender!==cur&&x.sender!=="general");
    const t = x.ts ? new Date(x.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "";
    // renderMarkdown escapes the whole text before it adds any tag of its own (src/ui/chat-render.js).
    const ticks = u && x.delivery ? AgendChatRender.deliveryHtml(x.delivery, TICK_LABELS()) : "";
    return `<div class="msg ${u?"inbound":"outbound"}"><div class="sender ${u?"user":"agent"}">${esc(x.sender)}<span class="time">${t}${ticks}</span></div><div class="md">${AgendChatRender.renderMarkdown(x.text)}</div>${AgendChatRender.attachmentsHtml(x.attachments)}</div>`;

// What the fleet has open for prompts right now. Prompt events are stream-only, so every stream (re)connect
// and every poll carries the whole list: a prompt posted, answered or expired while this page was not
// listening is caught up — and no timer ever re-reads anything, which would count as the person's activity.
function applyPrompts(list) {
  if (!Array.isArray(list)) return;
  const open = new Set(list.map(p => p.nonce));
  for (const p of list) {
    const had = prompts[p.nonce];
    // An answer already on its way keeps its "answering…" state: a snapshot must not hand its buttons back.
    if (!had || had.resolved === false) prompts[p.nonce] = { ...p, resolved: false, busy: !!(had && had.busy) };
  }
  // Open here but not there: answered or expired while this page was not listening.
  for (const n of Object.keys(prompts)) if (!prompts[n].resolved && !open.has(n)) prompts[n].resolved = true;
  renderPrompts();
}
function resolvePrompt(d) {
  const p = prompts[d.nonce]; if (!p) return;
  p.resolved = true; p.busy = false;
  if (d.outcome) p.outcome = d.outcome;
  setTimeout(() => { if (prompts[d.nonce] === p) { delete prompts[d.nonce]; if (p.instance === cur) renderPrompts(); } }, 60000);
  if (p.instance === cur) renderPrompts();
}
// Built from nodes: the prompt's text and its labels are text, never markup.
function renderPrompts() {
  const box = document.getElementById("prompts"); if (!box) return;
  box.textContent = "";
  for (const p of Object.values(prompts)) {
    if (p.instance !== cur) continue;
    const card = document.createElement("div"); card.className = `prompt${p.resolved ? " done" : ""}`;
    card.setAttribute("role", "group"); card.setAttribute("aria-label", p.text);
    const text = document.createElement("div"); text.className = "txt";
    text.textContent = p.resolved ? (p.outcome || tr("promptGone")) : p.text;
    card.append(text);
    if (!p.resolved) {
      const row = document.createElement("div"); row.className = "acts";
      for (const a of p.actions) {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = a.label;
        b.disabled = !!p.busy;
        b.onclick = () => answerPrompt(p, a.id);
        row.append(b);
      }
      if (p.busy) { const w = document.createElement("span"); w.className = "wait"; w.textContent = tr("promptAnswering"); row.append(w); }
      card.append(row);

async function answerPrompt(p, action) {
  if (p.busy || p.resolved) return;
  p.busy = true; renderPrompts();
  let r;
  try { r = await api("POST", "/ui/prompt", { instance: p.instance, nonce: p.nonce, action }); }
  catch (err) { r = { error: err && err.message ? err.message : tr("disconnected") }; }
  // Answered: the outcome arrives as prompt_resolved. Refused or gone: say why; a prompt that is no longer
  // open (answered on Telegram first, or expired) loses its buttons.
  if (r && r.answered) return;
  p.busy = false;
  if (r && r.gone) p.resolved = true;
  renderPrompts();
  toast(r && r.error ? r.error : tr("disconnected"), false);
}
const TICK_LABELS = () => ({ queued: tr("tick_queued"), processing: tr("tick_processing"), delivered: tr("tick_delivered"), failed: tr("tick_failed"), cancelled: tr("tick_cancelled") });
// "<name> is working…" and a Stop for the reply under way — built from nodes: the name is text, never markup.
function renderWorkBar() {
  const bar = document.getElementById("workBar"); if (!bar) return;
  const state = AgendChatRender.isBusy(activity[cur]) ? activity[cur] : "";
  // Every status frame comes through here: rebuild only on a change, or the Stop button a keyboard user
  // is on would be replaced (and its focus lost) every ten seconds.
  const shown = `${cur}\u0000${state}`;
  if (bar.dataset.shown === shown) return;
  bar.dataset.shown = shown;
  bar.textContent = "";
  if (!cur || !state) { bar.className = "work-bar"; return; }
  bar.className = `work-bar on${state === "stuck" ? " stuck" : ""}`;
  const dot = document.createElement("span"); dot.className = "pulse"; dot.setAttribute("aria-hidden", "true");
  const label = document.createElement("span"); label.className = "lbl"; label.textContent = trf(state === "stuck" ? "stuck" : "working", cur);
  const stop = document.createElement("button"); stop.type = "button"; stop.className = "btn btn-warn"; stop.id = "stopReply";
  stop.textContent = tr("stopReply"); stop.title = tr("stopReplyTitle");
  stop.onclick = () => cancelReply(cur, stop);
  bar.append(dot, label, stop);
}
async function cancelReply(target, button) {
  if (!target) return;
  if (button) button.disabled = true;
  let r;
  try { r = await api("POST", `/ui/cancel/${encodeURIComponent(target)}`); }
  catch (err) { r = { error: err && err.message ? err.message : tr("disconnected") }; }
  if (button) button.disabled = false;
  if (r && !r.error) toast(`${target}: ${tr("stopSent")}`);
  else toast(r && r.error ? r.error : tr("disconnected"), false);
}
function growComposer(inp) { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 240) + "px"; }
async function sendMsg() {
  const inp = document.getElementById("msgIn"), txt = inp.value.trim();
  const target = cur;                                  // the chat this message belongs to, whatever is on screen later
  const files = (pendingFiles[target] || []).slice();
  if ((!txt && !files.length) || !target || sending[target]) return;
  sending[target] = true;
  inp.value = ""; drafts[target] = ""; growComposer(inp);
  pendingFiles[target] = []; inFlightFiles[target] = files; renderPendingFiles();
  let r;
  try {
    // Each file goes up on its own (the server reads its type from the bytes and stores it in the
    // instance's inbox), then the message names them by the ids it got back.
    const ids = [];
    for (const f of files) ids.push((await uploadFile(target, f)).id);
    r = await api("POST", "/ui/send", ids.length ? { instance: target, message: txt, attachments: ids } : { instance: target, message: txt });
  } catch (err) { r = { error: err && err.message ? err.message : tr("disconnected") }; }
  sending[target] = false;
  delete inFlightFiles[target];
  if (r && !r.error) return;
  // Not delivered: never lose anything. The files go back to that chat's pending list, in front of any added
  // meanwhile — which always fit, because addFiles counted these as taken while they were in flight; the text goes back into its own composer if that is on screen
  // and empty, otherwise it is kept for its chat and offered back.
  if (files.length) {
    pendingFiles[target] = AgendChatRender.checkFiles(files, pendingFiles[target] || []).kept;
    if (target === cur) renderPendingFiles();
  }
  if (txt) {
    const now = document.getElementById("msgIn");
    if (AgendChatRender.settleFailedSend(target, cur, !!now, now ? now.value : "") === "restore") {
      now.value = txt; drafts[target] = txt; growComposer(now);
    } else {
      failedSends[target] = failedSends[target] ? failedSends[target] + "\n" + txt : txt;
      if (target === cur) renderFailedSend();
    }
  }
  toast(r && r.error ? r.error : tr("disconnected"), false);
}
/** One file up to the fleet; resolves to {id, …} or throws with the server's reason. */
async function uploadFile(target, file) {
  const r = await fetch(`/ui/upload?instance=${encodeURIComponent(target)}`, {
    method: "POST",
    headers: { "Content-Type": file.type || "application/octet-stream", "X-Agend-Filename": encodeURIComponent(file.name || "file") },
    body: file,
  });
  let body = {};
  try { body = await r.json(); } catch { /* not JSON */ }
  if (!r.ok || !body || typeof body.id !== "string") throw new Error(body && body.error ? `${file.name}: ${body.error}` : `${file.name}: upload failed (${r.status})`);
  return body;
}
function addFiles(list) {
  if (!cur) return;
  // A send in flight still owns its files (they return if it fails): new ones only get the room left beside them.
  const inFlight = inFlightFiles[cur] || [];
  const res = AgendChatRender.checkFiles(inFlight.concat(pendingFiles[cur] || []), [...(list || [])]);
  pendingFiles[cur] = res.kept.slice(inFlight.length);
  for (const x of res.rejected) toast(`${x.name}: ${tr("file_" + x.reason.replace(/-/g, "_"))}`, false);
  renderPendingFiles();
}
function renderPendingFiles() {
  const box = document.getElementById("pendingFiles"); if (!box) return;
  box.textContent = "";
  (pendingFiles[cur] || []).forEach((f, i) => {
    const chip = document.createElement("span"); chip.className = "file-chip";
    if (/^image\//.test(f.type) && typeof URL.createObjectURL === "function") {
      const img = document.createElement("img"); img.alt = ""; img.src = URL.createObjectURL(f); img.onload = () => URL.revokeObjectURL(img.src); chip.append(img);
    }
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = `${f.name} · ${AgendChatRender.formatSize(f.size)}`;
    const x = document.createElement("button"); x.type = "button"; x.title = tr("removeFile"); x.textContent = "✕";
    x.onclick = () => { pendingFiles[cur].splice(i, 1); renderPendingFiles(); };
    chip.append(nm, x); box.append(chip);
  });
}
function renderFailedSend() {
  const box = document.getElementById("failedSend"); if (!box) return;
  const kept = failedSends[cur];
  if (!kept) { box.className = ""; box.textContent = ""; return; }
  box.className = "failed-send";
  box.textContent = "";
  const label = document.createElement("span"); label.textContent = tr("notSent");
  const text = document.createElement("span"); text.className = "txt"; text.textContent = kept;
  const back = document.createElement("button"); back.className = "btn btn-accent"; back.textContent = tr("putBack");
  back.onclick = () => {
    const inp = document.getElementById("msgIn"); if (!inp) return;
    inp.value = AgendChatRender.putBack(kept, inp.value); drafts[cur] = inp.value; growComposer(inp);
    delete failedSends[cur]; renderFailedSend(); inp.focus();
  };
  const drop = document.createElement("button"); drop.className = "btn"; drop.textContent = tr("discard");
  drop.onclick = () => { delete failedSends[cur]; renderFailedSend(); };
  box.append(label, text, back, drop);
}

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function cronDesc(expr) {
  if (!expr) return "";
  const p = expr.trim().split(/\s+/);
  if (p.length < 5) return expr;
  const [min, hr, dom, mon, dow] = p;
  const time = (hr !== "*" && min !== "*") ? `at ${hr.padStart(2,"0")}:${min.padStart(2,"0")}` : "";
  if (min === "*" && hr === "*") return "Every minute";
  if (min.startsWith("*/")) return `Every ${min.slice(2)} minutes`;
  if (hr.startsWith("*/")) return `Every ${hr.slice(2)} hours`;
  if (dom === "*" && mon === "*" && dow === "*") return `Daily ${time}`;
  if (dom === "*" && mon === "*" && dow === "1-5") return `Weekdays ${time}`;
  if (dom === "*" && mon === "*" && dow !== "*") {
    const days = dow.split(",").map(d => { const n = parseInt(d); return isNaN(n) ? d : (DAYS[n] || d); });
    return `${days.join(", ")} ${time}`;
  }
  if (dom !== "*" && mon === "*") return `${dom}${dom==="1"?"st":dom==="2"?"nd":dom==="3"?"rd":"th"} of month ${time}`;
  return expr;
}

// ── Config form ──────────────────────────────────────────
let cfgData = null;
async function loadConfig() {
  const el = document.getElementById("configView"); if (!el) return;
  try {
    cfgData = await api("GET", "/ui/config");
    const ch = cfgData.channel || {};
    const acc = ch.access || {};
    const defs = cfgData.defaults || {};
    const roots = cfgData.project_roots || [];
    el.innerHTML = `
      <div class="card"><h3>Channel</h3>
        <div class="form-field"><label>Type</label><input id="cfg-type" value="${esc(ch.type||"")}" disabled style="opacity:0.5"></div>
        <div class="form-field"><label>Bot Token Env</label><input id="cfg-token-env" value="${esc(ch.bot_token_env||"AGEND_BOT_TOKEN")}" disabled style="opacity:0.5"></div>
        <div class="form-field"><label>Group ID</label>
          <div style="display:flex;gap:4px;align-items:center">
            <input id="cfg-gid" type="password" value="${ch.group_id||""}" style="flex:1">
            <button class="eye-btn" onclick="togglePw('cfg-gid')">&#128065;</button>
          </div></div>
      </div>
      <div class="card"><h3>Access Control</h3>
        <div class="form-field"><label>Mode</label>
          <select id="cfg-acc-mode"><option value="locked" ${acc.mode==="locked"?"selected":""}>Locked</option><option value="open" ${acc.mode==="open"?"selected":""}>Open</option></select></div>
        <div class="form-field"><label>Allowed Users</label>
          <div style="display:flex;gap:4px;align-items:center">
            <input id="cfg-users" type="password" value="${(acc.allowed_users||[]).join(", ")}" style="flex:1">
            <button class="eye-btn" onclick="togglePw('cfg-users')">&#128065;</button>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Comma-separated user IDs</div></div>
      </div>
      <div class="card"><h3>Defaults</h3>
        <div class="form-field"><label>Backend</label>
          <select id="cfg-backend">
            ${["claude-code","codex","opencode","kiro-cli","antigravity","grok","gemini-cli"].map(b => `<option value="${b}" ${defs.backend===b?"selected":""}>${b === "gemini-cli" ? "gemini-cli (deprecated)" : b}</option>`).join("")}
          </select></div>
      </div>
      <div class="card"><h3>Project Roots</h3>
        <div id="cfg-roots">${roots.map((r,i) => `<div style="display:flex;gap:4px;margin-bottom:6px"><input class="cfg-root" value="${esc(r)}" style="flex:1"><button class="btn btn-ghost" style="padding:4px 8px" onclick="this.parentElement.remove()">&#10005;</button></div>`).join("")}</div>
        <button class="btn btn-ghost" onclick="addRoot()">+ Add Root</button>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:16px">
        <button class="btn btn-accent" onclick="saveConfig()">Save Changes</button>
        <span style="font-size:11px;color:var(--text-muted)">Saving will reformat fleet.yaml (comments will be lost)</span>
      </div>`;
  } catch { el.innerHTML = `<div style="color:var(--error);padding:24px">${tr("configLoadFailed")}</div>`; }
}
function togglePw(id) { const el = document.getElementById(id); el.type = el.type === "password" ? "text" : "password"; }
function addRoot() { const el = document.getElementById("cfg-roots"); el.insertAdjacentHTML("beforeend", `<div style="display:flex;gap:4px;margin-bottom:6px"><input class="cfg-root" value="" placeholder="/path/to/projects" style="flex:1"><button class="btn btn-ghost" style="padding:4px 8px" onclick="this.parentElement.remove()">&#10005;</button></div>`); }
async function saveConfig() {
  const body = {
    channel: { group_id: document.getElementById("cfg-gid").value.trim(), access: { mode: document.getElementById("cfg-acc-mode").value, allowed_users: document.getElementById("cfg-users").value.split(",").map(s => s.trim()).filter(Boolean) } },
    defaults: { backend: document.getElementById("cfg-backend").value },
    project_roots: [...document.querySelectorAll(".cfg-root")].map(i => i.value.trim()).filter(Boolean),
  };
  const r = await api("POST", "/ui/config", body);
  if (r.error) toast(r.error, false);
  else { toast(tr("configSaved") + (r.needs_restart ? tr("configRestart") : "")); }
}
</script>
