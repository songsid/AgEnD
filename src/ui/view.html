<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgEnD View</title>
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/agend-auth.js"></script>
<script src="/assets/shell.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:#0d1117; --panel:#151b23; --panel-2:#1c2330; --border:#262c36; --fg:#d1d7e0; --dim:#8b949e;
    --accent:#58a6ff; --accent-soft:rgba(88,166,255,.14); --ok:#3fb950; --warn:#d29922; --crit:#f85149;
    --radius:8px;
  }
  html, body { width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; width: 100vw; min-width: 0; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar { width: 240px; flex: 0 0 240px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  /* The list scrolls; the filter stays pinned to the bottom of the sidebar. */
  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  /* The UA's default scrollbar is a light grey bar with arrows on this dark panel.
     Tinted from the sidebar's own --dim; scoped to #list so the terminal's own
     scrollbar (#term) is left alone. WebKit/Blink get the pseudo-elements (thin,
     rounded, no arrows, a hover state); Chromium 121+ would ignore them if
     scrollbar-color were also set, so the standard properties are Firefox-only. */
  #list::-webkit-scrollbar { width: 10px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-button { display: none; }
  #list::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--dim) 35%, transparent); background-clip: padding-box; border: 2px solid transparent; border-radius: 5px; }
  #list::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--dim) 70%, transparent); background-clip: padding-box; }
  @supports (-moz-appearance: none) {
    #list { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--dim) 35%, transparent) transparent; }
    #list:hover { scrollbar-color: color-mix(in srgb, var(--dim) 70%, transparent) transparent; }
  }
  #filterBar { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 8px 10px 9px; background: var(--panel); }
  .filter-wrap { position: relative; display: flex; align-items: center; }
  .filter-wrap .filter-icon { position: absolute; left: 8px; width: 13px; height: 13px; color: var(--dim); pointer-events: none; }
  #filterInput { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 26px 6px 27px; font-size: 12px; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  #filterInput::placeholder { color: #6e7681; }
  #filterInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.16); }
  #filterClear { position: absolute; right: 4px; width: 20px; height: 20px; border: none; border-radius: 50%; background: none; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; display: none; align-items: center; justify-content: center; padding: 0; }
  #filterClear.show { display: inline-flex; }
  #filterClear:hover { color: var(--fg); background: rgba(255,255,255,.08); }
  #filterCount { margin-top: 5px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
  #filterCount .filtering { color: var(--accent); }
  .filter-empty { padding: 18px 14px; color: var(--dim); font-size: 12px; text-align: center; }
  #sidebar h1 { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; letter-spacing: .3px; }
  #sidebar h1::before { content: ""; width: 10px; height: 10px; flex: 0 0 10px; border-radius: 3px; background: linear-gradient(135deg, var(--accent), #a371f7); box-shadow: 0 0 10px rgba(88,166,255,.45); }
  .group-header { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; user-select: none; }
  .group-header:hover { color: var(--fg); }
  .group-header .caret { font-size: 9px; opacity: .8; }
  .group-header .caret { width: 10px; flex: 0 0 10px; }
  .group-header .gcount { margin-left: auto; font-weight: 500; font-size: 10px; letter-spacing: 0; padding: 1px 6px; border-radius: 9px; background: var(--panel-2); color: var(--dim); }
  .inst { display: flex; align-items: center; gap: 8px; margin: 1px 6px; padding: 8px 10px 8px 14px; cursor: pointer; border-radius: 6px; border-left: 3px solid transparent; font-size: 13px; transition: background .12s; }
  .dragging { opacity: .4; }
  .drop-before { border-top: 2px solid var(--accent) !important; }
  .drop-after { border-bottom: 2px solid var(--accent) !important; }
  [draggable="true"] { cursor: grab; }
  .inst:hover { background: rgba(255,255,255,.045); }
  .inst.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .inst.active .nm { color: #f0f6fc; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .dot.running { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,185,80,.15); } .dot.stopped { background: #6e7681; } .dot.crashed { background: var(--crit); box-shadow: 0 0 0 3px rgba(248,81,73,.18); }
  .inst .identity { flex: 1; min-width: 0; }
  .inst .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inst .alias { display: block; margin-top: 2px; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inst .pct { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cli-icon { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
  .cli-claude-code { background: #c678dd; }
  .cli-kiro-cli { background: #58a6ff; }
  .cli-codex { background: #3fb950; }
  .cli-grok { background: #0d1117; border-color: #f0f6fc; }
  .cli-antigravity { background: #f85149; }
  .cli-opencode { background: #f0f6fc; }
  .cli-other { background: #6e7681; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* Padding kept at 5/6px: enough that glyphs don't touch the edge, small
     enough that the terminal keeps essentially the whole main area. */
  #term { flex: 1; background: #000; overflow: auto; scrollbar-gutter: stable; padding: 5px 6px; }
  #term pre { min-width: 100%; min-height: 100%; font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; line-height: 1.2; white-space: pre; color: #d0d0d0; }

  /* Card — a single compact bar by default so the terminal keeps the height.
     `.expanded` restores the tall layout with avatar + description. */
  #card { background: var(--panel); border-top: 1px solid var(--border); padding: 5px 10px; display: flex; gap: 10px; align-items: center; }
  #avatarBox { width: 24px; height: 24px; flex: 0 0 24px; }
  .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .avatar-ph { width: 100%; height: 100%; border-radius: 50%; background: #30363d; color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; text-transform: uppercase; user-select: none; }
  #cardBody { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; overflow: hidden; }
  #cardBody .row1 { display: flex; align-items: baseline; gap: 10px; flex: 0 0 auto; }
  #cardBody .dname { font-size: 13px; font-weight: 600; white-space: nowrap; }
  #cardBody .role { color: var(--accent); font-size: 12px; white-space: nowrap; }
  #cardBody .meta { color: var(--dim); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cardBody .desc { display: none; }
  #cardToggle { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; padding: 2px 4px; flex: 0 0 auto; }
  #cardToggle:hover { color: var(--fg); }

  #card.expanded { align-items: flex-start; padding: 12px 14px; }
  #card.expanded #avatarBox { width: 48px; height: 48px; flex: 0 0 48px; }
  #card.expanded .avatar-ph { font-size: 20px; }
  #card.expanded #cardBody { display: block; }
  #card.expanded #cardBody .dname { font-size: 16px; }
  #card.expanded #cardBody .role { font-size: 13px; }
  #card.expanded #cardBody .meta { font-size: 12px; margin-top: 3px; white-space: normal; overflow: visible; }
  #card.expanded #cardBody .desc { display: block; font-size: 13px; margin-top: 6px; color: #adbac7; white-space: pre-wrap; }
  #editBtn { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; flex: 0 0 auto; transition: border-color .15s, background .15s; }
  #editBtn:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* Edit form */
  #edit { display: none; flex-direction: column; gap: 8px; flex: 1; }
  #edit input, #edit textarea { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; width: 100%; }
  #edit textarea { resize: vertical; min-height: 48px; }
  #edit .actions { display: flex; gap: 8px; align-items: center; }
  #edit button { border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  #saveBtn { background: #238636; color: #fff; } #cancelBtn { background: #21262d; color: var(--fg); border: 1px solid var(--border); }
  #edit .hint { color: var(--dim); font-size: 11px; }
  #msg { font-size: 12px; }
  .err { color: #f85149; } .ok { color: #3fb950; }
  .help-btn { position: fixed; top: 10px; right: 14px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: rgba(21,27,35,.88); color: var(--dim); cursor: pointer; font-size: 16px; z-index: 60; display: inline-flex; align-items: center; justify-content: center; padding: 0; backdrop-filter: blur(6px); transition: color .15s, border-color .15s, background .15s; }
  .help-btn svg { width: 17px; height: 17px; }
  .help-btn:hover { color: #f0f6fc; background: var(--accent-soft); border-color: var(--accent); }
  .help-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 70; }
  .help-backdrop.open { display: block; }
  .help-panel { position: fixed; top: 0; right: 0; height: 100%; width: 360px; max-width: 90vw; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.4); transform: translateX(100%); transition: transform .2s ease; z-index: 80; overflow-y: auto; padding: 20px 22px; }
  .help-panel.open { transform: translateX(0); }
  .help-panel h3 { font-size: 17px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .help-panel h3 svg { width: 18px; height: 18px; color: var(--accent); }
  .help-panel ul { margin: 8px 0 0 18px; }
  .help-panel li { font-size: 13px; margin: 6px 0; color: var(--fg); }
  .help-panel .close { position: absolute; top: 14px; right: 16px; cursor: pointer; color: var(--dim); font-size: 22px; line-height: 1; background: none; border: none; }

  /* AI usage panel (shares .help-panel chrome) */
  .u-provider { margin: 14px 0 4px; padding: 14px 14px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-2); }
  .u-provider:first-of-type { margin-top: 6px; }
  .u-head { display: flex; align-items: center; gap: 8px; }
  .u-head .u-name { font-size: 15px; font-weight: 700; }
  .u-head .u-plan { color: var(--dim); font-size: 11px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 9px; }
  .u-order { display: flex; gap: 3px; margin-left: auto; }
  .u-move { width: 24px; height: 22px; border: 1px solid var(--border); border-radius: 5px; background: none; color: var(--dim); cursor: pointer; line-height: 1; }
  .u-move:hover:not(:disabled) { color: var(--fg); border-color: var(--accent); }
  .u-move:disabled { opacity: .25; cursor: default; }
  /* Readability: the percentage is the number people come here for, so it is
     large and bold, and the bar is thick enough to read at a glance. */
  .u-metric { margin: 14px 0 6px; }
  .u-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .u-row .u-label { color: #adbac7; flex: 1; min-width: 0; }
  .u-row .u-val { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; color: #f0f6fc; }
  .u-row .u-val.u-pct { font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -.5px; }
  .u-row .u-val.u-pct .u-unit { font-size: 14px; font-weight: 600; margin-left: 1px; opacity: .75; }
  .u-row .u-val.warn { color: var(--warn); } .u-row .u-val.crit { color: var(--crit); }
  .u-row .u-status { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 9px; align-self: center; }
  .u-status.warn { color: var(--warn); background: rgba(210,153,34,.14); } .u-status.crit { color: var(--crit); background: rgba(248,81,73,.14); }
  .u-meter { height: 10px; background: rgba(255,255,255,.07); border-radius: 5px; overflow: hidden; margin-top: 7px; }
  .u-fill { height: 100%; border-radius: 5px; background: var(--accent); min-width: 3px; transition: width .3s ease; }
  .u-fill.warn { background: var(--warn); } .u-fill.crit { background: var(--crit); }
  .u-sub { color: var(--dim); font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .u-err { color: var(--warn); font-size: 13px; margin: 8px 0; }
  /* Neutral note (subscription plan, or "sign-in needed") — deliberately not the
     amber error colour, since neither state is a failure. */
  .u-note { color: var(--dim); font-size: 13px; margin: 8px 0; }
  .u-foot { color: var(--dim); font-size: 11px; margin-top: 14px; display: flex; gap: 8px; align-items: baseline; }
  .u-foot button { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--dim); cursor: pointer; font-size: 11px; padding: 2px 8px; }
  .u-foot button:hover { color: var(--fg); border-color: var(--accent); }

  #densityBtn { font-size: 14px; font-weight: 600; letter-spacing: -.5px; }
  @media (max-width: 700px) {
    #sidebar { width: 180px; flex-basis: 180px; }
    /* The compact bar must stay one line; only the expanded form wraps. */
    #card.expanded { flex-wrap: wrap; padding: 10px 12px; }
    #edit { flex-basis: 100%; }
  }
</style>
</head>
<body>
  <button class="help-btn" id="usageBtn" data-i18n-title="usageButton" title="AI usage" style="right:140px; display:none"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 13.5h11"/><path d="M4.5 11V8"/><path d="M8 11V4.5"/><path d="M11.5 11V6.5"/></svg></button>
  <button class="help-btn" id="densityBtn" data-i18n-title="densityLabel" title="Font density" style="right:98px">⤢</button>
  <button class="help-btn" id="langBtn" data-i18n-title="languageButton" title="Language" style="right:56px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M2.3 8h11.4M8 2.2c1.7 1.6 2.6 3.6 2.6 5.8S9.7 12.2 8 13.8M8 2.2C6.3 3.8 5.4 5.8 5.4 8s.9 4.2 2.6 5.8"/></svg></button>
  <button class="help-btn" id="helpBtn" data-i18n-title="helpButton" title="Help"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M8 7.3v3.6"/><circle cx="8" cy="5.1" r=".6" fill="currentColor" stroke="none"/></svg></button>
  <div class="help-backdrop" id="helpBackdrop"></div>
  <aside class="help-panel" id="helpPanel">
    <button class="close" id="helpClose" data-i18n-title="close" title="Close">×</button>
    <div id="helpContent"></div>
  </aside>
  <aside class="help-panel" id="usagePanel">
    <button class="close" id="usageClose" data-i18n-title="close" title="Close">×</button>
    <div id="usageContent"></div>
  </aside>
  <div id="sidebar"><h1 data-i18n="viewTitle">AgEnD · View</h1><nav data-agend-nav data-compact data-current="view" style="margin:0 10px 8px"></nav><div id="list"></div>
    <div id="filterBar">
      <div class="filter-wrap">
        <svg class="filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5" stroke-linecap="round"/></svg>
        <input id="filterInput" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="filterPh" placeholder="Filter: name, model, backend" aria-label="Filter instances">
        <button id="filterClear" type="button" data-i18n-title="filterClear" title="Clear filter" aria-label="Clear filter">×</button>
      </div>
      <div id="filterCount" aria-live="polite"></div>
    </div>
  </div>
  <div id="main">
    <div id="term"><pre id="pre"></pre></div>
    <div id="card">
      <div id="avatarBox"></div>
      <div id="cardBody">
        <div class="row1"><span class="dname" id="dname">—</span><span class="role" id="role"></span></div>
        <div class="meta" id="meta"></div>
        <div class="desc" id="desc"></div>
      </div>
      <button id="cardToggle" data-i18n-title="expandProfile" title="Expand profile" aria-expanded="false">▲</button>
      <button id="editBtn" data-i18n="editProfile">✏️ Edit</button>
      <div id="edit">
        <input id="fDisplay" data-i18n-ph="displayName" placeholder="Display name">
        <input id="fRole" data-i18n-ph="role" placeholder="Role">
        <textarea id="fDesc" data-i18n-ph="description" placeholder="Description"></textarea>
        <input id="fAvatar" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
        <div class="actions">
          <button id="saveBtn" data-i18n="save">Save</button>
          <button id="cancelBtn" data-i18n="cancel">Cancel</button>
          <span id="msg"></span>
        </div>
        <div class="hint" data-i18n="saveHint">Saving needs a signed-in session. Send /dashboard to your AgEnD bot for a sign-in code.</div>
      </div>
    </div>
  </div>

<script>
(() => {
  // Reading is open unless the operator set web.view_access: session. Profile/avatar
  // writes need a signed-in session (the cookie; /assets/agend-auth.js adds the CSRF
  // header). No credential is ever placed in a URL or kept in localStorage here;
  // visual ordering is browser-local and never leaves localStorage.
  const q = (id) => document.getElementById(id);

  // ── i18n ──
  const I18N = {
    en: { viewTitle: "AgEnD · View", editProfile: "✏️ Edit", save: "Save", cancel: "Cancel",
      filterPh: "Filter: name, model, backend", filterClear: "Clear filter", filterNone: "No instance matches", filterShown: "shown",
      displayName: "Display name", role: "Role", description: "Description",
      saveHint: "Saving needs a signed-in session. Send /dashboard to your AgEnD bot for a sign-in code.", helpTitle: "📖 Help",
      help1: "Pick an instance on the left → its live terminal shows on the right",
      help2: "Click a group header ▼/▶ to collapse/expand", help3: "✏️ Edit changes display name, role, description",
      help4: "Drag groups or instances to reorder them in this browser",
      help5: "Click ⤢ to cycle font density: Fit → Comfortable → Compact",
      densityFit: "Fit", densityComfortable: "Comfortable", densityCompact: "Compact", densityLabel: "Font density",
      usageTitle: "📊 AI Usage", usageEmpty: "No AI CLI logins found on this machine.",
      usageUpdated: "updated", usageRefresh: "Refresh", usageHigh: "high", usageNear: "near limit",
      usageMoveUp: "Move up", usageMoveDown: "Move down",
      tooltipBackend: "Backend: {value}", tooltipStatus: "Status: {value}", tooltipContext: "Context: {value}",
      tooltipModel: "Model: {value}", tooltipEffort: "Effort: {value}",
      tooltipUnavailable: "Unavailable", statusRunning: "Running", statusPaused: "Paused",
      statusStopped: "Stopped", statusCrashed: "Crashed", statusUnknown: "Unknown",
      usageResets: "resets in {t}", usageSoon: "resets soon", usageFail: "Could not load usage data.",
      "usage.title": "AI Subscription Usage", "usage.title_plain": "AI subscription usage", "usage.empty_active": "No active backends with usage tracking",
      "usage.not_logged_in": "not logged in", "usage.error_fallback": "error", "usage.no_data": "no data",
      "usage.reset.in": "resets in {0}", "usage.reset.soon": "resets soon",
      "usage.duration.days_hours": "{0}d {1}h", "usage.duration.hours_minutes": "{0}h {1}m", "usage.duration.minutes": "{0}m",
      "usage.metric.session": "Session", "usage.metric.weekly": "Weekly", "usage.metric.monthly": "Monthly",
      "usage.metric.days_window": "{0}-day window", "usage.metric.named": "{0}",
      "usage.metric.named_session": "{0} (session)", "usage.metric.named_weekly": "{0} (weekly)",
      "usage.metric.named_monthly": "{0} (monthly)", "usage.metric.named_days": "{0} ({1}d)",
      "usage.metric.extra_usage": "Extra usage", "usage.metric.rate_limit_resets": "Rate limit resets",
      "usage.metric.credits": "Credits", "usage.metric.weekly_limit": "Weekly limit",
      "usage.metric.pay_as_you_go": "Pay as you go", "usage.metric.bonus_credits": "Bonus credits",
      "usage.metric.overage_charges": "Overage charges", "usage.metric.pay_per_use": "Pay-per-use",
      "usage.metric.usage_monthly": "Usage (monthly)",
      "usage.unit.available": "available", "usage.unit.credits": "credits",
      "usage.value.disabled": "Disabled", "usage.value.cap": "{0} cap", "usage.value.unlimited": "♾️ Unlimited",
      "usage.note.binding": "binding", "usage.note.binding_severity": "binding · {0}",
      "usage.note.busiest_model": "busiest of {0} model", "usage.note.busiest_models": "busiest of {0} models",

  const BASE = ["#000000","#cd3131","#0dbc79","#e5e510","#2472c8","#bc3fbc","#11a8cd","#e5e5e5"];
  const BRIGHT = ["#666666","#f14c4c","#23d18b","#f5f543","#3b8eea","#d670d6","#29b8db","#ffffff"];

  function ansiToHtml(text) {
    let out = "", fg = null, bg = null, bold = false, open = false;
    const style = () => {
      const p = [];
      let f = fg;
      if (bold && typeof f === "number" && f < 8) f = BRIGHT[f];
      else if (typeof f === "number") f = BASE[f];
      if (f) p.push("color:" + f);
      if (bg) p.push("background:" + (typeof bg === "number" ? BASE[bg] : bg));
      if (bold) p.push("font-weight:bold");

    const openSpan = () => { const s = style(); if (s) { out += `<span style="${s}">`; open = true; } };

      if (codes.length === 0) codes.push(0);

        const c = codes[i];
        if (c === 0) { fg = bg = null; bold = false; }
        else if (c === 1) bold = true;
        else if (c === 22) bold = false;
        else if (c === 39) fg = null;
        else if (c === 49) bg = null;
        else if (c >= 30 && c <= 37) fg = c - 30;

      const names = items.map(it => it.instance_name).sort((a, b) => {
        const ia = sortInsts.has(a) ? sortInsts.get(a) : Infinity;
        const ib = sortInsts.has(b) ? sortInsts.get(b) : Infinity;
        return ia - ib;
      });
      instByGroup.set(g, names);
    }
  }

  // ── sidebar filter (#999) — pure; tests execute this block ──
  function normalizeFilter(query) {
    return String(query == null ? "" : query).trim().toLowerCase();
  }
  /** Case-insensitive substring on name (incl. display name), model and backend. */
  function instanceMatchesFilter(it, needle, labelOf) {
    if (!needle) return true;
    const fields = [it.instance_name, it.display_name, it.model, it.backend, labelOf ? labelOf(it.backend) : null];
    return fields.some(value => typeof value === "string" && value.toLowerCase().includes(needle));
  }
  /** Visible groups in display order, and the "N / M" counts. */
  function filterSidebar(groupNames, instByGroup, rosterByName, query, labelOf) {
    const needle = normalizeFilter(query);
    const groups = [];
    let shown = 0, total = 0;
    for (const g of groupNames) {
      const names = (instByGroup.get(g) || []).filter(name => rosterByName.has(name));
      total += names.length;
      const visible = names.filter(name => instanceMatchesFilter(rosterByName.get(name), needle, labelOf));
      shown += visible.length;
      if (visible.length) groups.push({ group: g, names: visible });
    }
    return { groups, shown, total, active: needle.length > 0 };
  }
  // ── end sidebar filter ──

  function renderFilterStatus(view) {
    const count = q("filterCount");
    count.innerHTML = view.active
      ? `<span class="filtering">${view.shown} / ${view.total}</span><span>${esc(T("filterShown"))}</span>`
      : `<span>${view.shown} / ${view.total}</span>`;
    q("filterClear").classList.toggle("show", filterQuery.length > 0);
  }

  function renderList() {
    const list = q("list");
    list.innerHTML = "";
    const view = filterSidebar(groupNames, instByGroup, rosterByName, filterQuery, backendLabel);
    for (const { group: g, names } of view.groups) {
      const isCollapsed = collapsed.has(g);
      const header = document.createElement("div");
      header.className = "group-header";
      // Reordering a filtered subset would be ambiguous; drag only the full list.
      header.draggable = !view.active;
      header.innerHTML = `<span class="caret">${isCollapsed ? "▶" : "▼"}</span><span>${esc(g)}</span><span class="gcount">${names.length}</span>`;
      header.onclick = () => { if (collapsed.has(g)) collapsed.delete(g); else collapsed.add(g); renderList(); };
      wireDrag(header, { type: "group", name: g });
      list.appendChild(header);
      if (isCollapsed) continue;

      for (const name of names) {
        const it = rosterByName.get(name);
        const el = document.createElement("div");
        el.className = "inst" + (name === current ? " active" : "");
        el.draggable = !view.active;
        // M2: context_pct != null shows value including 0%; null means unavailable (empty)
        const alias = sidebarAlias(it);
        el.innerHTML = `<span class="dot ${it.status}"></span><span class="identity"><span class="nm">${esc(it.instance_name)}</span>${alias ? `<span class="alias">${esc(alias)}</span>` : ""}</span><span class="pct">${it.context_pct != null ? Math.round(it.context_pct)+"%" : ""}</span>${backendIconHtml(it.backend)}`;
        el.title = instanceTooltip(it);
        el.onclick = () => select(name);
        wireDrag(el, { type: "instance", name, group: g });
        list.appendChild(el);
      }
    }
    if (view.active && !view.groups.length) list.innerHTML = `<div class="filter-empty">${esc(T("filterNone"))}</div>`;
    renderFilterStatus(view);
  }

  // ── Drag & drop ───────────────────────────────────────
  function wireDrag(el, item) {
    el.addEventListener("dragstart", (e) => {
      dragItem = item;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", item.name); } catch { /* Firefox needs data set */ }
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      document.querySelectorAll(".drop-before,.drop-after").forEach(n => n.classList.remove("drop-before", "drop-after"));
      dragItem = null;
    });
    el.addEventListener("dragover", (e) => {
      if (!dragItem || dragItem.type !== item.type) return;                 // only same kind
      if (item.type === "instance" && dragItem.group !== item.group) return; // no cross-group
      if (dragItem.name === item.name) return;
      e.preventDefault();
      const before = e.clientY < el.getBoundingClientRect().top + el.offsetHeight / 2;
      el.classList.toggle("drop-before", before);
      el.classList.toggle("drop-after", !before);
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-before", "drop-after"));
    el.addEventListener("drop", (e) => {
      e.preventDefault();
      const before = el.classList.contains("drop-before");
      el.classList.remove("drop-before", "drop-after");
      if (!dragItem || dragItem.type !== item.type) return;
      if (item.type === "group") reorder(groupNames, dragItem.name, item.name, before);
      else if (dragItem.group === item.group) reorder(instByGroup.get(item.group), dragItem.name, item.name, before);
      else return;
      renderList();
      persistOrder();
    });
  }

  function reorder(arr, moving, target, before) {
    if (!arr) return;
    const from = arr.indexOf(moving);
    if (from === -1) return;
    arr.splice(from, 1);
    let to = arr.indexOf(target);
    if (to === -1) { arr.push(moving); return; }
    if (!before) to += 1;
    arr.splice(to, 0, moving);
  }

  function orderRows() {
    const rows = [];
    groupNames.forEach((g, i) => rows.push({ item_type: "group", item_name: g, sort_index: i, group_name: null }));
    for (const g of groupNames) {
      (instByGroup.get(g) || []).forEach((n, j) => rows.push({ item_type: "instance", item_name: n, sort_index: j, group_name: g }));
    }
    return rows;
  }

  function persistOrder() {
    // Mirror into the local maps so a mid-flight refresh doesn't revert.
    sortGroups = new Map(groupNames.map((g, i) => [g, i]));
    sortInsts = new Map();
    for (const g of groupNames) (instByGroup.get(g) || []).forEach((n, j) => sortInsts.set(n, j));
    try { localStorage.setItem(SIDEBAR_ORDER_KEY, JSON.stringify(orderRows())); }
    catch { /* ordering still applies for this page even if storage is unavailable */ }
  }

  function restoreSidebarOrder() {
    sortGroups = new Map(); sortInsts = new Map();
    try {
      const rows = JSON.parse(localStorage.getItem(SIDEBAR_ORDER_KEY) || "[]");
      if (!Array.isArray(rows)) return;
      for (const row of rows) {
        if (row.item_type === "group" && typeof row.item_name === "string") sortGroups.set(row.item_name, Number(row.sort_index) || 0);
        else if (row.item_type === "instance" && typeof row.item_name === "string") sortInsts.set(row.item_name, Number(row.sort_index) || 0);
      }
    } catch { /* ignore invalid browser-local state */ }
  }

  function renderCard() {
    const it = roster.find(r => r.instance_name === current);
    if (!it) return;
    q("dname").textContent = it.display_name || it.instance_name;
    q("role").textContent = it.role || "";
    // R2: context_pct != null shows value including 0%; null means unavailable (hide)
    const ctxPart = it.context_pct != null ? ` · ctx ${Math.round(it.context_pct)}%` : "";
    q("meta").textContent = `${it.instance_name} · ${it.backend}${it.model ? " · " + it.model : ""}${ctxPart} · ${it.status}`;
    q("desc").textContent = it.description || "";
    // Only issue an <img> request when an avatar actually exists — otherwise a
    // 404 shows a broken-image icon. No avatar → CSS placeholder (initial).
    const box = q("avatarBox");
    if (it.has_avatar) {
      const base = `/api/avatar/${encodeURIComponent(it.instance_name)}`;
      // Only rebuild (and cache-bust) when the avatar's instance changed.
      // Rebuilding every renderCard re-issued the <img> request each 5s
      // loadRoster tick, which made the avatar flicker. Compare the raw src
      // attribute (relative, as set) rather than img.src (resolved absolute).
      const existingImg = box.querySelector("img");
      const cur = existingImg ? (existingImg.getAttribute("src") || "") : "";
      // The delimiter (base+"?" / base+"&") prevents a prefix collision between
      // e.g. ".../foo" and ".../foobar".
      const sameAvatar = existingImg && (cur.startsWith(base + "?") || cur.startsWith(base + "&"));
      if (!sameAvatar) {
        const src = base + (base.includes("?") ? "&" : "?") + "t=" + Date.now(); // cache-bust, correct query separator
        box.innerHTML = `<img class="avatar-img" alt="" src="${src}">`;
      }
    } else {
      const initial = (it.display_name || it.instance_name || "?").trim().charAt(0) || "?";
      const ph = box.querySelector(".avatar-ph");
      if (!ph || ph.textContent !== initial) {
        box.innerHTML = `<div class="avatar-ph">${esc(initial)}</div>`;
      }
    }
  }

  async function loadRoster() {
    try {
      const pr = await fetch("/api/profiles");
      if (!pr.ok) throw new Error("HTTP " + pr.status);
      roster = await pr.json();
      rosterByName = new Map(roster.map(r => [r.instance_name, r]));
      if (!current && roster.length) current = roster[0].instance_name;
      computeOrder();
      renderList(); renderCard();
    } catch (e) { q("pre").textContent = TF("rosterFailed", { error: e.message }); }
  }

  // ── Terminal ──────────────────────────────────────────
  async function refreshPane() {
    if (!current) return;
    // If the user is selecting text inside the pane, skip this refresh so the
    // 800ms poll doesn't wipe the selection mid-copy. Resumes on the next tick
    // once the selection is released/collapsed.
    const sel = window.getSelection();
    if (sel && sel.toString().length > 0 && sel.anchorNode && q("pre").contains(sel.anchorNode)) return;
    const target = current;  // guard against a switch mid-fetch
    try {
      const r = await fetch(`/api/pane/${encodeURIComponent(target)}`);
      if (target !== current) return;  // user switched while awaiting — drop stale
      if (!r.ok) {
        // Surface the failure instead of leaving the previous instance's output
        // on screen (which reads as "switching did nothing").
        q("pre").textContent = TF("paneFailed", { name: target, status: r.status });
        return;
      }
      const text = await r.text();
      if (target !== current) return;
      // Pane grid comes from tmux, so a sparse frame can't distort the fit.
      const c = Number(r.headers.get("X-Pane-Cols")), rw = Number(r.headers.get("X-Pane-Rows"));
      if (c >= 1 && rw >= 1 && (c !== paneCols || rw !== paneRows)) { paneCols = c; paneRows = rw; lastFitKey = ""; }
      q("pre").innerHTML = ansiToHtml(text);
      fitFont();
    } catch { /* transient network error — keep last frame */ }
  }

  // ── Font sizing ───────────────────────────────────────
  // Measured advance width of one monospace cell as a fraction of font-size.
  // The old hardcoded .6em was only an estimate and drifts per resolved font.
  // The ratio is font-size independent, so measuring once is enough.
  let cellRatio = 0;
  function glyphRatio() {
    if (cellRatio) return cellRatio;
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;font-size:100px";
    probe.style.fontFamily = getComputedStyle(q("pre")).fontFamily;
    probe.textContent = "0".repeat(100);
    document.body.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    if (w > 0) cellRatio = w / 100 / 100;   // ÷100 chars, ÷100px font-size
    return cellRatio || 0.6;                // headless / odd env → old estimate
  }

  // The removed 48px ceiling was what made an 80x24 pane render at ~33px on a
  // 1080p screen — the "font is huge" complaint. A single desktop range is
  // enough; /view is not targeting phones.
  const MIN_PX = 12, MAX_PX = 22;

  // Order: fit → clamp → user density → absolute readability bounds. When the
  // clamped size can't show all `cols`, #term scrolls rather than shrinking
  // below the floor.
  function fitFont() {
    if (paneCols < 1 || paneRows < 1) return;   // no trustworthy size yet
    const term = q("term"), pre = q("pre");
    const cs = getComputedStyle(term);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const innerW = Math.max(1, term.clientWidth - (padX || 0));
    const innerH = Math.max(1, term.clientHeight - (padY || 0));
    const key = `${paneCols}x${paneRows}@${Math.round(innerW)}x${Math.round(innerH)}/${density}`;
    if (key === lastFitKey) return;
    const pcs = getComputedStyle(pre);
    const lhRatio = parseFloat(pcs.lineHeight) / parseFloat(pcs.fontSize);
    const lineH = Number.isFinite(lhRatio) && lhRatio > 0 ? lhRatio : 1.2;
    const widthFit = innerW / (paneCols * glyphRatio());
    const heightFit = innerH / (paneRows * lineH);
    // 0.5% slack keeps an exact fit from rounding into a scrollbar (paired with
    // scrollbar-gutter:stable, that's what stops resize→scrollbar→resize loops).
    let size = Math.min(widthFit, heightFit) * 0.995;
    size = Math.max(MIN_PX, Math.min(size, MAX_PX));
    size *= DENSITY[density] || 1;
    size = Math.max(8, Math.min(size, 32));
    lastFitKey = key;
    // Sub-pixel churn (a scrollbar appearing shrinks the box, which would shrink
    // the font, which would hide the scrollbar again) resolves to a no-op here.
    if (Math.abs(size - appliedSize) < 0.75) return;
    appliedSize = size;
    pre.style.fontSize = size.toFixed(2) + "px";
  }

  function scheduleFit() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { lastFitKey = ""; fitFont(); }, 80);
  }

  function renderDensityBtn() {
    const b = q("densityBtn");
    if (!b) return;
    b.textContent = DENSITY_GLYPH[density];
    b.title = `${T("densityLabel")}: ${T("density" + density.charAt(0).toUpperCase() + density.slice(1))}`;
  }

  function cycleDensity() {
    density = DENSITY_ORDER[(DENSITY_ORDER.indexOf(density) + 1) % DENSITY_ORDER.length];
    localStorage.setItem("agend_view_density", density);
    renderDensityBtn();
    lastFitKey = "";
    fitFont();
  }

  function select(name) {
    if (name === current) return;
    current = name;
    lastFitKey = "";            // force a refit once the new pane's size lands
    exitEdit();
    q("pre").textContent = "";  // blank the old instance's output immediately
    renderList(); renderCard(); refreshPane();
  }

  // ── Edit ──────────────────────────────────────────────
  // The card is a one-line bar by default; expanding it (or editing) is what
  // borrows height back from the terminal.
  let cardExpanded = localStorage.getItem("agend_view_card_expanded") === "1";
  function applyCardExpanded(on) {
    q("card").classList.toggle("expanded", on);
    const t = q("cardToggle");
    t.textContent = on ? "▼" : "▲";
    t.setAttribute("aria-expanded", on ? "true" : "false");
    scheduleFit();   // the terminal just gained or lost height
  }
  function setCardExpanded(on, persist) {
    if (persist) { cardExpanded = on; localStorage.setItem("agend_view_card_expanded", on ? "1" : "0"); }
    applyCardExpanded(on);
  }

  // Whether this browser holds a session. Asked when Edit is pressed rather than at load: the
  // answer can change while the page is open (signed in from another tab, or expired).
  async function isSignedIn() {
    try { return (await fetch("/auth/session", { cache: "no-store" })).ok; } catch { return false; }
  }

  async function enterEdit() {
    const it = roster.find(r => r.instance_name === current);
    if (!it) return;
    if (!(await isSignedIn())) {
      // Sign in, then come back to this page.
      location.href = "/signin?next=" + encodeURIComponent("/view");
      return;
    }
    q("fDisplay").value = it.display_name || "";
    q("fRole").value = it.role || "";
    q("fDesc").value = it.description || "";
    q("msg").textContent = "";
    applyCardExpanded(true);          // form needs the room; don't persist it
    q("cardBody").style.display = "none";
    q("cardToggle").style.display = "none";
    q("editBtn").style.display = "none";
    q("edit").style.display = "flex";
  }
  function exitEdit() {
    q("edit").style.display = "none";
    q("cardBody").style.display = "";
    q("cardToggle").style.display = "";
    q("editBtn").style.display = "";
    applyCardExpanded(cardExpanded);  // back to the user's own preference
  }

  async function save() {
    const it = roster.find(r => r.instance_name === current);
    if (!it) return;
    const name = encodeURIComponent(current);
    try {
      const r = await fetch(`/api/profile/${name}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ display_name: q("fDisplay").value, role: q("fRole").value, description: q("fDesc").value }),
      });
      if (r.status === 401) throw new Error(T("signInToSave"));
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ("HTTP " + r.status)); }
      const file = q("fAvatar").files[0];
      if (file) {
        const ar = await fetch(`/api/avatar/${name}`, { method: "POST", headers: { "Content-Type": file.type }, body: file });
        if (!ar.ok) { const e = await ar.json().catch(() => ({})); throw new Error(TF("avatarFailed", { error: e.error || ar.status })); }
      }
      q("msg").className = "ok"; q("msg").textContent = T("saved");
      await loadRoster();
      setTimeout(exitEdit, 500);
    } catch (e) { q("msg").className = "err"; q("msg").textContent = e.message.startsWith(T("avatarFailed").split("{")[0]) ? e.message : TF("saveFailed", { error: e.message }); }
  }

  q("editBtn").onclick = enterEdit;
  q("cancelBtn").onclick = exitEdit;
  q("saveBtn").onclick = save;
  q("cardToggle").onclick = () => setCardExpanded(!q("card").classList.contains("expanded"), true);

  const setHelp = (open) => { q("helpPanel").classList.toggle("open", open); q("helpBackdrop").classList.toggle("open", open); };
  q("helpBtn").onclick = () => setHelp(!q("helpPanel").classList.contains("open"));
  q("helpClose").onclick = () => setHelp(false);
  q("helpBackdrop").onclick = () => setHelp(false);
  q("langBtn").onclick = () => { lang = lang === "en" ? "zh-TW" : "en"; localStorage.setItem("agend_lang", lang); applyI18n(); renderList(); };

  // ── Filter input ──────────────────────────────────────
  const setFilter = (value) => { filterQuery = value; renderList(); };
  q("filterInput").addEventListener("input", (e) => setFilter(e.target.value));
  q("filterInput").addEventListener("keydown", (e) => {
    if (e.key === "Escape" && filterQuery) { e.stopPropagation(); e.target.value = ""; setFilter(""); }
  });
  q("filterClear").onclick = () => { q("filterInput").value = ""; setFilter(""); q("filterInput").focus(); };
  // "/" focuses the filter, as in most list UIs — never while typing elsewhere.
  window.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault(); q("filterInput").focus();
  });
  q("densityBtn").onclick = cycleDensity;
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") setHelp(false); });

  // ── AI usage panel ────────────────────────────────────
  let usageData = null;
  let usageTimer = null;
  let usageOrder = [];
  try {
    const saved = JSON.parse(localStorage.getItem(USAGE_ORDER_KEY) || "[]");
    if (Array.isArray(saved)) usageOrder = saved.filter(v => typeof v === "string");
  } catch { /* ignore invalid browser-local state */ }

  function providerKey(provider) { return String(provider.id || provider.name || ""); }
  function orderedUsageProviders(providers) {
    const rank = new Map(usageOrder.map((id, i) => [id, i]));
    return providers.map((provider, index) => ({ provider, index })).sort((a, b) => {
      const ar = rank.has(providerKey(a.provider)) ? rank.get(providerKey(a.provider)) : Infinity;
      const br = rank.has(providerKey(b.provider)) ? rank.get(providerKey(b.provider)) : Infinity;
      return ar === br ? a.index - b.index : ar - br;
    }).map(entry => entry.provider);
  }

  function moveUsageProvider(id, delta) {
    if (!usageData || !Array.isArray(usageData.providers)) return;
    const ids = orderedUsageProviders(usageData.providers).map(providerKey);
    const from = ids.indexOf(id), to = from + delta;
    if (from < 0 || to < 0 || to >= ids.length) return;
    [ids[from], ids[to]] = [ids[to], ids[from]];
    usageOrder = ids;
    try { localStorage.setItem(USAGE_ORDER_KEY, JSON.stringify(usageOrder)); }
    catch { /* ordering still applies for this page even if storage is unavailable */ }
    renderUsage();
  }

  function usageResetText(iso) {
    if (!iso) return "";
    const ms = new Date(iso).getTime() - Date.now();
    if (isNaN(ms)) return "";
    if (ms <= 0) return T("usage.reset.soon");
    const totalMinutes = Math.max(1, Math.ceil(ms / 60000));
    const d = Math.floor(totalMinutes / 1440), h = Math.floor((totalMinutes % 1440) / 60), m = totalMinutes % 60;
    const duration = totalMinutes >= 2880
      ? usageLocalized("", { key: "usage.duration.days_hours", args: [d, h] })
      : totalMinutes >= 60
        ? usageLocalized("", { key: "usage.duration.hours_minutes", args: [Math.floor(totalMinutes / 60), m] })
        : usageLocalized("", { key: "usage.duration.minutes", args: [totalMinutes] });
    return usageLocalized("", { key: "usage.reset.in", args: [duration] });
  }

  function usageLocalized(fallback, ref) {
    if (!ref || typeof ref.key !== "string") return fallback == null ? "" : String(fallback);
    const args = Array.isArray(ref.args) ? ref.args : [];
    return args.reduce((text, value, index) => text.replaceAll(`{${index}}`, String(value)), T(ref.key));
  }

  function usageMetricHtml(m) {
    const label = usageLocalized(m.label, m.labelI18n);
    const note = m.note ? usageLocalized(m.note, m.noteI18n) : "";
    if (m.type === "percent") {
      const pct = Math.min(100, Math.max(0, m.used ?? 0));
      const cls = pct >= 90 ? "crit" : pct >= 70 ? "warn" : "";
      const word = pct >= 90 ? T("usageNear") : pct >= 70 ? T("usageHigh") : "";
      const sub = [note, usageResetText(m.resetsAt)].filter(Boolean).join(" · ");
      return `<div class="u-metric"><div class="u-row"><span class="u-label">${esc(label)}</span>` +
        (word ? `<span class="u-status ${cls}">${esc(word)}</span>` : "") +
        `<span class="u-val u-pct ${cls}">${pct.toFixed(0)}<span class="u-unit">%</span></span></div>` +
        `<div class="u-meter"><div class="u-fill ${cls}" style="width:${pct}%"></div></div>` +
        (sub ? `<div class="u-sub">${esc(sub)}</div>` : "") + `</div>`;
    }
    if (m.type === "dollars") {
      const val = m.limit ? `$${(m.used ?? 0).toFixed(2)} / $${m.limit.toFixed(2)}` : `$${(m.used ?? 0).toFixed(2)}`;
      return `<div class="u-metric"><div class="u-row"><span class="u-label">${esc(label)}</span><span class="u-val">${esc(val)}</span></div>` +
        (note ? `<div class="u-sub">${esc(note)}</div>` : "") + `</div>`;
    }
    const value = usageLocalized(m.value ?? "", m.valueI18n);
    const unit = usageLocalized(m.unit ?? "", m.unitI18n);
    const val = `${value} ${unit}`.trim();
    return `<div class="u-metric"><div class="u-row"><span class="u-label">${esc(label)}</span><span class="u-val">${esc(val)}</span></div>` +
      (note ? `<div class="u-sub">${esc(note)}</div>` : "") + `</div>`;
  }

  const USAGE_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 13.5h11"/><path d="M4.5 11V8"/><path d="M8 11V4.5"/><path d="M11.5 11V6.5"/></svg>';
  function renderUsage() {
    const box = q("usageContent");
    if (!usageData || !Array.isArray(usageData.providers)) { box.innerHTML = `<h3>${USAGE_ICON}${T("usage.title")}</h3><div class="u-err">${T("usageFail")}</div>`; return; }
    let html = `<h3>${USAGE_ICON}${T("usage.title")}</h3>`;
    const providers = orderedUsageProviders(usageData.providers);
    if (!providers.length) html += `<div class="u-err">${T("usage.empty_active")}</div>`;
    for (let index = 0; index < providers.length; index++) {
      const p = providers[index];
      const key = providerKey(p);
      html += `<div class="u-provider"><div class="u-head"><span class="u-name">${esc(p.name)}</span>` +
        (p.plan ? `<span class="u-plan">${esc(p.plan)}</span>` : "") +
        `<span class="u-order"><button class="u-move" data-provider="${esc(key)}" data-delta="-1" title="${T("usageMoveUp")}" aria-label="${T("usageMoveUp")}"${index === 0 ? " disabled" : ""}>↑</button>` +
        `<button class="u-move" data-provider="${esc(key)}" data-delta="1" title="${T("usageMoveDown")}" aria-label="${T("usageMoveDown")}"${index === providers.length - 1 ? " disabled" : ""}>↓</button></span></div>`;
      if (p.status === "error") html += `<div class="u-err">${esc(usageLocalized(p.error || T("usage.error_fallback"), p.errorI18n))}</div>`;
      else if (p.status === "no-credentials") {
        html += `<div class="u-note">${esc(T("usage.not_logged_in"))}</div>`;
        if (p.hint) html += `<div class="u-note">${esc(usageLocalized(p.hint, p.hintI18n))}</div>`;
      }
      else {
        html += (p.metrics || []).map(usageMetricHtml).join("");
        // A provider with nothing to meter (subscription plan) or one awaiting
        // sign-in carries a hint instead of metrics. Without this the panel
        // rendered an empty box, so those states looked broken.
        if (p.hint) html += `<div class="u-note">${esc(usageLocalized(p.hint, p.hintI18n))}</div>`;
        else if (!(p.metrics || []).length) html += `<div class="u-note">${esc(T("usage.no_data"))}</div>`;
      }
      html += `</div>`;
    }
    const at = new Date(usageData.fetchedAt).toLocaleTimeString();
    html += `<div class="u-foot"><span>${T("usageUpdated")} ${esc(at)}</span><button id="usageRefresh">${T("usageRefresh")}</button></div>`;
    box.innerHTML = html;
    box.querySelectorAll(".u-move").forEach(button => {
      button.onclick = () => moveUsageProvider(button.dataset.provider, Number(button.dataset.delta));
    });
    const rb = q("usageRefresh");
    if (rb) rb.onclick = () => loadUsage(true);
  }

  async function loadUsage(force) {
    try {
      const r = await fetch(`/api/ai-usage${force ? "?force=1" : ""}`);
      if (r.status === 404) { q("usageBtn").style.display = "none"; return false; }
      usageData = await r.json();
    } catch { usageData = null; }
    renderUsage();
    return true;
  }

  const setUsage = (open) => {
    q("usagePanel").classList.toggle("open", open);
    q("helpBackdrop").classList.toggle("open", open);
    if (open) { setHelp(false); loadUsage(false); if (!usageTimer) usageTimer = setInterval(() => loadUsage(false), 60_000); }
    else if (usageTimer) { clearInterval(usageTimer); usageTimer = null; }
  };
  q("usageBtn").onclick = () => setUsage(!q("usagePanel").classList.contains("open"));
  q("usageClose").onclick = () => setUsage(false);
  q("helpBackdrop").addEventListener("click", () => setUsage(false));
  q("helpBtn").addEventListener("click", () => setUsage(false));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") setUsage(false); });
  q("langBtn").addEventListener("click", () => { if (usageData) renderUsage(); });
  // Probe once at boot: shows the usage button only when the endpoint is enabled,
  // and warms the server-side 5-minute cache so the first open is instant.
  loadUsage(false).then(ok => { if (ok !== false) q("usageBtn").style.display = ""; });

  window.addEventListener("resize", scheduleFit);
  // Catches container changes the window resize event doesn't see — chiefly the
  // profile card expanding or collapsing.
  if (window.ResizeObserver) new ResizeObserver(scheduleFit).observe(q("term"));
  applyI18n();
  applyCardExpanded(cardExpanded);
  restoreSidebarOrder();

  // ── Boot ──────────────────────────────────────────────
  loadRoster().then(() => { refreshPane(); });
  poll = setInterval(refreshPane, 800);
  setInterval(loadRoster, 5000);  // refresh status dots / ctx%
})();
</script>
</body>
</html>
